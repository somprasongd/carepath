# Static SPA server for the prod web tier. Routing lives in the edge proxy
# (proxy.conf); this container only serves the built bundle. SPA routes are
# client-side (TanStack Router), so paths that match no file fall back to
# index.html.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
