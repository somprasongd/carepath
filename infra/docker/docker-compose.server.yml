# Image-based stack for the dev host (61.19.253.24, ~/docker-apps/carepath).
# The Release workflow (.github/workflows/release.yml) ships this file there
# as docker-compose.yml, rsyncs infra/postgres/migrations/ to ./migrations,
# and pins the version via IMAGE_TAG in ~/docker-apps/carepath/.env.
#
# Same topology as docker-compose.prod.yml — one origin behind the edge
# proxy — but every CarePath tier comes from GHCR instead of a local build.
# The host's port 80/443 belong to nginx-proxy-manager, so the edge proxy
# publishes on a high port (CAREPATH_EDGE_PORT, default 8080) and also joins
# the shared `webproxy` network so NPM can route a domain to it later.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carepath}
      POSTGRES_USER: ${POSTGRES_USER:-carepath}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carepath} -d ${POSTGRES_DB:-carepath}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mock-his:
    image: ghcr.io/somprasongd/carepath-mock-his:${IMAGE_TAG:?set in .env}
    environment:
      PORT: 8090
      # Visit-link mint (ADR-0014) is called server-side over the compose
      # network — same env names as docker-compose.yml (dev). Leave
      # CAREPATH_HIS_API_KEY empty to keep the legacy ?visit= QR; set it
      # (same value as the api's HIS_API_KEY) to serve minted #vt= slip
      # QRs instead. PATIENT_APP_BASE_URL absolute-izes the console's
      # fallback link; unset keeps it same-origin relative, which works
      # behind the edge proxy.
      CAREPATH_API_INTERNAL_BASE_URL: ${CAREPATH_API_INTERNAL_BASE_URL:-http://api:8080}
      CAREPATH_HIS_API_KEY: ${CAREPATH_HIS_API_KEY:-}
      PATIENT_APP_BASE_URL: ${PATIENT_APP_BASE_URL:-}
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.18.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      # search_path=public pins golang-migrate's bookkeeping table to one
      # schema. Without it the tracker lands in "first schema in
      # search_path" — `carepath` once migration 000001 has created it —
      # so a fresh DB tracks in public while a re-run tracks in carepath
      # and re-applies everything from scratch (dirty-db crash). Same fix
      # as docker-compose.yml (dev); docker-compose.prod.yml gets it too.
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-carepath}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-carepath}?sslmode=disable&search_path=public
      - up

  api:
    image: ghcr.io/somprasongd/carepath-api:${IMAGE_TAG:?set in .env}
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-carepath}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-carepath}?sslmode=disable
      HIS_BASE_URL: ${HIS_BASE_URL:-http://mock-his:8090}
      HIS_INGEST_INTERVAL: ${HIS_INGEST_INTERVAL:-5s}
      LINE_CHANNEL_ID: ${LINE_CHANNEL_ID:-}
      ALLOW_DEMO_AUTH: ${ALLOW_DEMO_AUTH:-false}
      SESSION_TTL: ${SESSION_TTL:-24h}
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-168h}
      SHARE_LINK_TTL: ${SHARE_LINK_TTL:-4h}
      # Visit link (ADR-0014). HIS_API_KEY + VISIT_LINK_SECRET must BOTH be
      # set or the mint/redeem routes don't register at all (fail-closed) —
      # same wiring as docker-compose.yml (dev). PATIENT_APP_BASE_URL is
      # the absolute public origin minted #vt= URLs ride on; unset logs a
      # warning and mints localhost links, so set it on this stack.
      HIS_API_KEY: ${HIS_API_KEY:-}
      VISIT_LINK_SECRET: ${VISIT_LINK_SECRET:-}
      VISIT_LINK_COMPLETED_GRACE: ${VISIT_LINK_COMPLETED_GRACE:-30m}
      PATIENT_APP_BASE_URL: ${PATIENT_APP_BASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mock-his:
        condition: service_started
    restart: unless-stopped

  web:
    image: ghcr.io/somprasongd/carepath-web:${IMAGE_TAG:?set in .env}
    depends_on:
      - api
    restart: unless-stopped

  proxy:
    image: ghcr.io/somprasongd/carepath-proxy:${IMAGE_TAG:?set in .env}
    ports:
      - "${CAREPATH_EDGE_PORT:-8080}:80"
    depends_on:
      - web
      - api
      - mock-his
    restart: unless-stopped
    networks:
      default: null
      webproxy:
        aliases:
          # Deterministic name for nginx-proxy-manager to target
          # (https://carepath.somprasongd.work → carepath:80 there).
          - carepath

volumes:
  pgdata:
    name: carepath_pgdata

networks:
  # Shared bridge with nginx-proxy-manager; remove this (and the proxy's
  # webproxy join) when deploying somewhere that doesn't have it.
  webproxy:
    name: webproxy
    external: true
