# CarePath edge proxy: the only exposed origin in docker-compose.prod.yml.
# It routes by longest path prefix:
#
#   /api/v1/demo/visits…, /api/v1/demo/orders…  → mock-his (console actions)
#   /api/v1/events                              → mock-his (HIS event feed)
#   /console                                    → mock-his (operator console)
#   /api/… (everything else, incl. demo/zigbee)  → CarePath api
#   /…                                          → web (static SPA)
#
# The demo paths don't collide: the only /api/v1/demo route CarePath itself
# serves is /api/v1/demo/zigbee/location. HIS server-to-server traffic
# (api polling /api/v1/events, /api/v1/visits/:id) stays on the docker
# network via HIS_BASE_URL and never passes through here.
server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Mock HIS console surface. `location /api/` above is a shorter prefix,
    # so these win for their paths; CarePath keeps /api/v1/demo/zigbee/*.
    location = /api/v1/demo/visits {
        proxy_pass http://mock-his:8090;
    }
    location /api/v1/demo/visits/ {
        proxy_pass http://mock-his:8090;
    }
    location /api/v1/demo/orders/ {
        proxy_pass http://mock-his:8090;
    }
    location = /api/v1/events {
        proxy_pass http://mock-his:8090;
    }
    location /console {
        proxy_pass http://mock-his:8090;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
    }
}
