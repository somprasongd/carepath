services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carepath}
      POSTGRES_USER: ${POSTGRES_USER:-carepath}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carepath}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - carepath_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carepath} -d ${POSTGRES_DB:-carepath}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-his:
    build:
      context: .
      dockerfile: infra/docker/mock-his.Dockerfile
    environment:
      PORT: 8090
    ports:
      - "${MOCK_HIS_PORT:-8090}:8090"

  migrate:
    image: migrate/migrate:v4.18.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./infra/postgres/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-carepath}:${POSTGRES_PASSWORD:-carepath}@postgres:5432/${POSTGRES_DB:-carepath}?sslmode=disable
      - up

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-carepath}:${POSTGRES_PASSWORD:-carepath}@postgres:5432/${POSTGRES_DB:-carepath}?sslmode=disable
      HIS_BASE_URL: ${HIS_BASE_URL:-http://mock-his:8090}
      HIS_INGEST_INTERVAL: ${HIS_INGEST_INTERVAL:-5s}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mock-his:
        condition: service_started
    ports:
      - "${CAREPATH_API_PORT:-8080}:8080"

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    depends_on:
      - api
    ports:
      - "5173:5173"

volumes:
  carepath_pg:
