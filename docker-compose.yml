services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carepath}
      POSTGRES_USER: ${POSTGRES_USER:-carepath}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carepath}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - carepath_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carepath} -d ${POSTGRES_DB:-carepath}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-his:
    build:
      context: .
      dockerfile: infra/docker/mock-his.Dockerfile
    environment:
      PORT: 8090
      PATIENT_APP_BASE_URL: ${PATIENT_APP_BASE_URL:-http://localhost:5173}
      # Console pickers read CarePath's service-point list; dev runs the two
      # apps on separate ports, so point the browser at the published API.
      CAREPATH_API_BASE_URL: ${CAREPATH_API_BASE_URL:-http://localhost:8080}
    ports:
      - "${MOCK_HIS_PORT:-8090}:8090"

  migrate:
    image: migrate/migrate:v4.18.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./infra/postgres/migrations:/migrations:ro
    command:
      - -path=/migrations
      # search_path=public pins golang-migrate's bookkeeping table to
      # public.schema_migrations. Without it the CLI resolves "the first
      # schema in search_path" — which becomes carepath once migration
      # 000001 creates it — and starts a second, empty schema_migrations
      # there, re-running already-applied migrations against live tables.
      - -database=postgres://${POSTGRES_USER:-carepath}:${POSTGRES_PASSWORD:-carepath}@postgres:5432/${POSTGRES_DB:-carepath}?sslmode=disable&search_path=public
      - up

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-carepath}:${POSTGRES_PASSWORD:-carepath}@postgres:5432/${POSTGRES_DB:-carepath}?sslmode=disable
      HIS_BASE_URL: ${HIS_BASE_URL:-http://mock-his:8090}
      HIS_INGEST_INTERVAL: ${HIS_INGEST_INTERVAL:-5s}
      LINE_CHANNEL_ID: ${LINE_CHANNEL_ID:-}
      ALLOW_DEMO_AUTH: ${ALLOW_DEMO_AUTH:-false}
      SESSION_TTL: ${SESSION_TTL:-24h}
      SHARE_LINK_TTL: ${SHARE_LINK_TTL:-4h}
      JWT_SECRET: ${JWT_SECRET:-}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-168h}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mock-his:
        condition: service_started
    ports:
      - "${CAREPATH_API_PORT:-8080}:8080"

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      # Empty by default → the browser talks same-origin to the Vite server,
      # which proxies /api to the backend. (`-` not `:-` so an explicitly
      # empty value in .env isn't replaced by a default.)
      VITE_API_BASE_URL: ${VITE_API_BASE_URL-}
      # Where the Vite /api proxy forwards inside the docker network.
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://api:8080}
      # LIFF entry disabled for now — flip both to re-enable (see
      # apps/web/src/auth/AuthProvider.tsx).
      VITE_AUTH_MODE: ${VITE_AUTH_MODE:-demo}
      VITE_LIFF_ID: ${VITE_LIFF_ID:-}
    depends_on:
      - api
    ports:
      - "5173:5173"

volumes:
  carepath_pg:
