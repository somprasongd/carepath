basePath: /
definitions:
  analytics.Overview:
    properties:
      asOf:
        type: string
      servicePoints:
        items:
          $ref: '#/definitions/analytics.ServicePointMetrics'
        type: array
      summary:
        $ref: '#/definitions/analytics.Summary'
      window:
        type: string
    type: object
  analytics.ServicePointMetrics:
    properties:
      avgServiceMinutes:
        type: number
      avgWaitMinutes:
        type: number
      code:
        type: string
      completedCount:
        type: integer
      inProgressNow:
        type: integer
      longestWaitingMinutes:
        type: number
      name:
        type: string
      servicePointId:
        type: string
      waitingNow:
        type: integer
    type: object
  analytics.Summary:
    properties:
      activeVisits:
        type: integer
      avgVisitMinutes:
        type: number
      avgWaitMinutes:
        type: number
      bottleneckServicePointId:
        type: string
    type: object
  auth.identityResponse:
    properties:
      displayName:
        type: string
      roles:
        items:
          type: string
        type: array
      userId:
        type: string
      username:
        type: string
    type: object
  auth.loginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  auth.refreshRequest:
    properties:
      refreshToken:
        type: string
    type: object
  auth.tokensResponse:
    properties:
      accessToken:
        type: string
      expiresAt:
        type: string
      identity:
        $ref: '#/definitions/auth.identityResponse'
      refreshExpiresAt:
        type: string
      refreshToken:
        type: string
    type: object
  floorplan.FloorView:
    properties:
      activePlanId:
        description: |-
          ActivePlanID names the plan PlanURL was built from, so a client that
          already has that plan's id (e.g. from the admin history listing) can
          tell it is the active one directly, rather than reconstructing the
          fact by checking whether its digest appears inside the URL.
        type: string
      buildingId:
        type: string
      code:
        type: string
      floorId:
        type: string
      levelOrder:
        type: integer
      name:
        type: string
      planUrl:
        type: string
      viewBox:
        type: string
    type: object
  floorplan.Stored:
    properties:
      createdAt:
        type: string
      createdBy:
        description: |-
          CreatedBy is nil for the plans seeded from packages/floorplans, which
          no admin uploaded.
        type: string
      floorId:
        type: string
      planId:
        type: string
      sha256:
        type: string
      viewBox:
        type: string
      warnings:
        items:
          $ref: '#/definitions/floorplan.Warning'
        type: array
    type: object
  floorplan.Warning:
    properties:
      code:
        description: |-
          Code is the stable machine-readable reason; display text is the
          client's (ADR-0012).
        type: string
      ref:
        description: Ref is the place id, node id, or element the warning is about.
        type: string
    type: object
  hospitalmap.Floor:
    properties:
      buildingId:
        type: string
      code:
        type: string
      id:
        type: string
      levelOrder:
        type: integer
      name:
        type: string
      viewBox:
        description: |-
          ViewBox is the floor's coordinate space ("0 0 1600 900"), the space
          every Place X/Y and every nav node coordinate is expressed in. It is
          set by the floor's first plan and holds every later one to it
          (ADR-0015); nil on a floor that has no plan yet.
        type: string
    type: object
  hospitalmap.Place:
    properties:
      entryNodeId:
        type: string
      floor:
        $ref: '#/definitions/hospitalmap.Floor'
      floorId:
        type: string
      id:
        type: string
      name:
        type: string
      type:
        type: string
      x:
        type: number
      "y":
        type: number
    type: object
  httpx.ErrorResponse:
    properties:
      code:
        example: not_found
        type: string
      error:
        example: visit not found
        type: string
    type: object
  journey.PlanningExample:
    properties:
      id:
        type: string
      scenario:
        $ref: '#/definitions/journey.PlanningExampleScenario'
      steps:
        items:
          $ref: '#/definitions/journey.PlanningExampleStep'
        type: array
    type: object
  journey.PlanningExampleOrder:
    properties:
      orderRef:
        type: string
      orderType:
        type: string
      orderedByClinic:
        type: string
    type: object
  journey.PlanningExampleScenario:
    properties:
      clinics:
        items:
          type: string
        type: array
      orders:
        items:
          $ref: '#/definitions/journey.PlanningExampleOrder'
        type: array
      visitType:
        type: string
    type: object
  journey.PlanningExampleStep:
    properties:
      clinicCode:
        type: string
      kind:
        type: string
      orderRefs:
        items:
          type: string
        type: array
      round:
        type: integer
      sequence:
        type: integer
      status:
        type: string
      stepKey:
        type: string
    type: object
  journey.PlanningOrderType:
    properties:
      orderType:
        type: string
      stepKind:
        type: string
    type: object
  journey.PlanningPhase:
    properties:
      key:
        type: string
      number:
        type: integer
    type: object
  journey.PlanningRules:
    properties:
      examples:
        items:
          $ref: '#/definitions/journey.PlanningExample'
        type: array
      orderTypes:
        items:
          $ref: '#/definitions/journey.PlanningOrderType'
        type: array
      phases:
        items:
          $ref: '#/definitions/journey.PlanningPhase'
        type: array
    type: object
  journey.QueueStep:
    properties:
      avgWaitMinutes:
        type: number
      estimatedWaitMinutes:
        type: number
      servicePointId:
        type: string
      stepKey:
        type: string
      waitingAhead:
        type: integer
    type: object
  journey.QueueView:
    properties:
      asOf:
        type: string
      steps:
        items:
          $ref: '#/definitions/journey.QueueStep'
        type: array
      visitId:
        type: string
    type: object
  journey.StationQueue:
    properties:
      asOf:
        type: string
      servicePointId:
        type: string
      serving:
        items:
          $ref: '#/definitions/journey.StationQueueEntry'
        type: array
      waiting:
        items:
          $ref: '#/definitions/journey.StationQueueEntry'
        type: array
    type: object
  journey.StationQueueEntry:
    properties:
      clinicCode:
        type: string
      kind:
        type: string
      patientName:
        type: string
      patientRef:
        type: string
      readyAt:
        description: |-
          ReadyAt is when the step entered READY — the moment the patient
          joined this queue. Nil only when no timeline row survived (a row
          seeded outside the normal flow); such entries still queue, last.
        type: string
      round:
        type: integer
      sequence:
        type: integer
      startedAt:
        description: StartedAt is set while the step is being served.
        type: string
      status:
        description: READY (waiting) or STARTED (being served)
        type: string
      stepKey:
        type: string
      totalSteps:
        type: integer
      visitId:
        type: string
    type: object
  journey.StepView:
    properties:
      clinicCode:
        type: string
      kind:
        type: string
      orderRefs:
        items:
          type: string
        type: array
      round:
        type: integer
      sequence:
        type: integer
      servicePoint:
        $ref: '#/definitions/servicepoint.ServicePoint'
      servicePointId:
        type: string
      status:
        type: string
      stepKey:
        type: string
    type: object
  journey.View:
    properties:
      actionable:
        items:
          $ref: '#/definitions/journey.StepView'
        type: array
      completed:
        type: boolean
      patientName:
        type: string
      patientRef:
        type: string
      recommendationReason:
        description: |-
          RecommendationReason names the criterion behind Recommended, so the
          pick is explainable rather than a black box. Empty exactly when
          Recommended is nil.
        type: string
      recommended:
        $ref: '#/definitions/journey.StepView'
      status:
        type: string
      steps:
        items:
          $ref: '#/definitions/journey.StepView'
        type: array
      syncedAt:
        type: string
      visitId:
        type: string
    type: object
  journey.transitionRequestBody:
    properties:
      commandId:
        type: string
      source:
        type: string
      to:
        type: string
    type: object
  location.Observation:
    properties:
      confidence:
        type: number
      floorId:
        type: string
      nodeId:
        type: string
      observedAt:
        type: string
      source:
        $ref: '#/definitions/location.Source'
      visitId:
        type: string
      zone:
        type: string
    type: object
  location.Source:
    enum:
    - QR
    - ZIGBEE
    - MANUAL
    type: string
    x-enum-comments:
      SourceManual: 'fallback/debug: a human-picked node'
      SourceQR: 'MVP baseline: a scanned CarePath QR code'
      SourceZigbee: 'phase 2: positioning service over Zigbee tags'
    x-enum-varnames:
    - SourceQR
    - SourceZigbee
    - SourceManual
  location.reportRequestBody:
    properties:
      raw:
        type: string
      source:
        type: string
    type: object
  location.zigbeeSimulatorRequestBody:
    properties:
      confidence:
        type: number
      floorId:
        type: string
      visitId:
        type: string
      zone:
        type: string
    type: object
  main.HealthResponse:
    properties:
      service:
        example: carepath-api
        type: string
      status:
        example: ok
        type: string
    type: object
  navigation.NavEdge:
    properties:
      accessible:
        type: boolean
      distance:
        type: number
      edgeType:
        description: CORRIDOR, ELEVATOR, STAIRS
        type: string
      fromNodeId:
        type: string
      id:
        type: string
      toNodeId:
        type: string
    type: object
  navigation.NavNode:
    properties:
      floorId:
        type: string
      id:
        type: string
      nodeType:
        description: ENTRANCE, PLACE_ENTRY, CORRIDOR, ELEVATOR, STAIRS
        type: string
      x:
        type: number
      "y":
        type: number
      zone:
        type: string
    type: object
  navigation.Route:
    properties:
      nodes:
        items:
          $ref: '#/definitions/navigation.NavNode'
        type: array
      segments:
        items:
          $ref: '#/definitions/navigation.NavEdge'
        type: array
      totalDistance:
        type: number
    type: object
  notification.Pref:
    properties:
      enabled:
        type: boolean
      visitId:
        type: string
    type: object
  notification.setRequestBody:
    properties:
      enabled:
        type: boolean
    type: object
  servicepoint.ServicePoint:
    properties:
      code:
        type: string
      id:
        type: string
      name:
        type: string
      place:
        $ref: '#/definitions/hospitalmap.Place'
      placeId:
        type: string
    type: object
  session.createRequest:
    properties:
      idToken:
        type: string
      source:
        type: string
    type: object
  session.createResponse:
    properties:
      expiresAt:
        type: string
      identity:
        $ref: '#/definitions/session.identityResponse'
      sessionToken:
        type: string
      visitId:
        description: |-
          VisitID is set only by the visit-token bootstrap: the visit the slip
          token addressed, already claimed for this session. Absent for line and
          demo sessions, which claim separately.
        type: string
    type: object
  session.identityResponse:
    properties:
      displayName:
        type: string
      externalId:
        type: string
      source:
        type: string
    type: object
  share.LinkSecret:
    properties:
      expiresAt:
        type: string
      token:
        type: string
    type: object
  share.SharedJourney:
    properties:
      currentStep:
        $ref: '#/definitions/share.SharedStep'
      expiresAt:
        type: string
      status:
        type: string
      updatedAt:
        type: string
    type: object
  share.SharedStep:
    properties:
      floorName:
        type: string
      servicePointName:
        type: string
      status:
        type: string
      title:
        type: string
    type: object
  visitlink.Link:
    properties:
      visitId:
        type: string
      visitUrl:
        type: string
    type: object
  visitlink.redeemRequest:
    properties:
      token:
        type: string
    type: object
  visitlink.redeemResponse:
    properties:
      visitId:
        type: string
    type: object
info:
  contact: {}
  description: |-
    Patient journey and indoor navigation API above the HIS.
    Serves the CarePath-derived journey plan (ADR-0009) with
    every actionable step resolved to its service point.
  title: CarePath API
  version: 1.0.0
paths:
  /api/v1/admin/floors/{floorId}/health:
    get:
      description: 'ADR-0015: recomputes the active plan''s warnings against the map
        model as it stands right now, unlike the warnings on the plan itself (from
        /plans), which are a snapshot frozen at upload time. Empty when the floor
        has no active plan.'
      parameters:
      - description: Floor id
        in: path
        name: floorId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/floorplan.Warning'
            type: array
        "401":
          description: missing, malformed, or expired staff access token
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: authenticated, but not an ADMIN
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: unknown floor
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Re-check the floor's active plan against the map model
      tags:
      - admin
  /api/v1/admin/floors/{floorId}/plan:
    post:
      consumes:
      - image/svg+xml
      description: 'FR-11/ADR-0015: replaces the floor''s plan. Send the SVG as the
        raw request body. The upload is parsed, held to a closed allowlist and re-serialized
        before storage, so a rejection means the file has to change — nothing is silently
        stripped. A place or navigation node the plan does not draw is a warning rather
        than a rejection: the app already shows such a place as not routable yet.
        Plans are append-only, so this adds a row and moves the floor''s pointer;
        re-uploading an unchanged file is idempotent.'
      parameters:
      - description: Floor id (e.g. I-1301)
        in: path
        name: floorId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/floorplan.Stored'
        "400":
          description: the plan broke a rule — the message names which
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: missing, malformed, or expired staff access token
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: authenticated, but not an ADMIN
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: unknown floor
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Upload a floor plan
      tags:
      - admin
  /api/v1/admin/floors/{floorId}/plans:
    get:
      description: 'ADR-0015: every plan stored for this floor, newest first, with
        the warnings each was accepted with. Plans are never deleted, so this is both
        the history and the list a rollback picks from.'
      parameters:
      - description: Floor id
        in: path
        name: floorId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/floorplan.Stored'
            type: array
        "401":
          description: missing, malformed, or expired staff access token
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: authenticated, but not an ADMIN
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: unknown floor
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - bearerAuth: []
      summary: List a floor's plans
      tags:
      - admin
  /api/v1/admin/floors/{floorId}/plans/{planId}/activate:
    post:
      description: 'ADR-0015: the rollback. Plans are append-only, so returning to
        an earlier drawing moves the floor''s pointer rather than restoring anything.'
      parameters:
      - description: Floor id
        in: path
        name: floorId
        required: true
        type: string
      - description: Plan id from the plans listing
        in: path
        name: planId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/floorplan.Stored'
        "401":
          description: missing, malformed, or expired staff access token
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: authenticated, but not an ADMIN
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: no such plan on that floor
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Make a stored plan the floor's active one
      tags:
      - admin
  /api/v1/admin/floors/{floorId}/plans/{planId}/raw:
    get:
      description: 'ADR-0015: the original bytes, before normalization, so an admin
        can get back the file they sent. This is never what a patient is served —
        that is always the normalized artifact.'
      parameters:
      - description: Floor id
        in: path
        name: floorId
        required: true
        type: string
      - description: Plan id from the plans listing
        in: path
        name: planId
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: the uploaded file
          schema:
            type: string
        "401":
          description: missing, malformed, or expired staff access token
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: authenticated, but not an ADMIN
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: no such plan on that floor
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Download a plan as it was uploaded
      tags:
      - admin
  /api/v1/analytics/overview:
    get:
      description: 'Operational metrics for the executive dashboard (#86): per-service-point
        wait/service numbers and visit-wide summary, aggregated in SQL from the append-only
        step timeline (#85). window=today means midnight-to-now in the analytics timezone
        (Asia/Bangkok by default). Executives get EXECUTIVE logins that reach this
        surface and nothing else (ADR-0010); no patient-level data (NFR-03).'
      parameters:
      - description: Aggregation window; only \
        enum:
        - today
        in: query
        name: window
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/analytics.Overview'
        "400":
          description: unsupported window
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: missing, malformed, or expired staff access token
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: authenticated, but the user's roles do not allow this action
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Get the executive analytics overview
      tags:
      - analytics
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Verifies a username against an argon2id password hash and returns
        a short-lived JWT access token plus a rotating opaque refresh token. Unknown
        username, wrong password, and deactivated account are deliberately indistinguishable
        (same 401 body, same timing).
      parameters:
      - description: username and password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.tokensResponse'
        "400":
          description: invalid request body
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: invalid credentials
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Staff/admin login
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Revokes the presented refresh token. Idempotent — an unknown, expired
        or already-revoked token also returns 204, so a client can always clear its
        own state.
      responses:
        "204":
          description: No content
        "400":
          description: invalid request body
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Log out
      tags:
      - auth
  /api/v1/auth/me:
    get:
      description: The staff/admin identity and role codes behind the presented access
        token. The console calls it on boot to restore a session from a stored refresh
        token.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.identityResponse'
        "401":
          description: missing, malformed, or expired access token
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: The current staff identity
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: 'Exchanges a refresh token for a new access + refresh pair; the
        presented token is spent. Presenting an already-spent token is treated as
        a leak: every refresh token of that user is revoked and the call returns 401.'
      parameters:
      - description: the refresh token issued by login or a previous refresh
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.refreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.tokensResponse'
        "400":
          description: invalid request body
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: unknown, expired, revoked, or already-spent refresh token
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Refresh the token pair
      tags:
      - auth
  /api/v1/auth/session:
    get:
      description: 'Resolves the Authorization: Bearer session token to the identity
        behind it.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/session.identityResponse'
        "401":
          description: session not found or expired
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Get the current session identity
      tags:
      - auth
    post:
      consumes:
      - application/json
      description: Exchanges a LINE ID token, a slip-held visit-link token (source
        "visit-token", which also claims the visit it addresses), or — when enabled
        — a demo identity for an opaque CarePath session token.
      parameters:
      - description: 'source: line|demo|visit-token, idToken: the LINE ID token or
          visit-link token (ignored for demo)'
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/session.createRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/session.createResponse'
        "400":
          description: invalid request body
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: invalid identity token, or demo auth disabled
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: visit-token unknown, rotated, cancelled, or past grace
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Create a patient session
      tags:
      - auth
  /api/v1/demo/zigbee/location:
    post:
      consumes:
      - application/json
      description: 'Demo-only simulator for the Zigbee positioning service (#33):
        reports a zone-level fix for the visit through the canonical ZIGBEE location
        provider and returns the recorded observation. The zone resolves to its representative
        navigation node, which becomes the routing start point like any other location.
        A real Zigbee integration will consume positioning-service pushes through
        a separate adapter, not this endpoint.'
      parameters:
      - description: 'Simulated zone fix: visitId, floorId, zone, optional confidence'
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/location.zigbeeSimulatorRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/location.Observation'
        "400":
          description: invalid body, or a floor/zone that does not resolve to a known
            location
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: missing or invalid staff access token
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: authenticated, but not STAFF or ADMIN
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Simulate a Zigbee zone fix
      tags:
      - location
  /api/v1/floors:
    get:
      description: '#105/ADR-0015: every floor in display order with the URL of its
        current plan. This is the pointer document the web app revalidates; the plan
        URL it hands back is immutable and cached for a year. Replaces the floor list
        apps/web used to hardcode beside its bundled plan assets.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/floorplan.FloorView'
            type: array
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: List floors and their plan URLs
      tags:
      - floors
  /api/v1/floors/{floorId}/plan/{asset}:
    get:
      description: '#105/ADR-0015: the normalized SVG for a floor, addressed by its
        own sha256. The response is immutable — a different drawing is a different
        digest and therefore a different URL — so it is cached for a year and never
        revalidated. Take this URL from the floors listing rather than assembling
        it.'
      parameters:
      - description: Floor id (e.g. I-1301)
        in: path
        name: floorId
        required: true
        type: string
      - description: The plan's sha256 with an .svg suffix, as the floors listing
          spells it
        in: path
        name: asset
        required: true
        type: string
      produces:
      - image/svg+xml
      responses:
        "200":
          description: the floor plan SVG
          schema:
            type: string
        "404":
          description: no plan with that digest on that floor
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Get a floor plan
      tags:
      - floors
  /api/v1/his/visits/{visitId}/patient-link:
    post:
      description: 'Returns the visit''s navigation-slip link (#136): a high-entropy
        token behind /patient/journey#vt=… that the patient''s session redeems into
        visit ownership. Repeat calls return the same URL (a re-print never invalidates
        the slip in the patient''s hand); rotate=true discards it — lost slip, suspected
        leak — and the previous link stops redeeming. The visit''s lifetime governs
        the link: ACTIVE is live, COMPLETED lives out VISIT_LINK_COMPLETED_GRACE,
        CANCELLED dies at once. Service-to-service: X-HIS-API-Key, the system''s only
        inbound HIS→CarePath call. format=qr answers the same URL encoded as a PNG
        QR ready for the slip.'
      parameters:
      - description: Visit id (VN)
        in: path
        name: visitId
        required: true
        type: string
      - description: url (JSON, default) or qr (image/png of the same URL)
        in: query
        name: format
        type: string
      - description: Discard the current token and mint a new one (default false)
        in: query
        name: rotate
        type: boolean
      responses:
        "200":
          description: 'format=qr: the link as a PNG QR'
          schema:
            type: string
        "400":
          description: unknown format value
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: missing or invalid HIS API key
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: visit not projected
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - hisApiKey: []
      summary: Mint the visit's patient link (HIS surface)
      tags:
      - his
  /api/v1/journeys/{visitId}:
    get:
      description: 'Returns the CarePath-derived journey plan (ADR-0009): steps in
        display order, each resolved to its service point, with every currently-actionable
        step and CarePath''s recommendation among them. A completed visit is reported
        with completed=true and no actionable steps. Patient-surface (#96): the patient
        session''s identity must have claimed this visit; an unclaimed or unknown
        visit answers the same 404.'
      parameters:
      - description: Visit ID
        in: path
        name: visitId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/journey.View'
        "401":
          description: missing or invalid patient session
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: visit unknown, or not claimed by this session — indistinguishable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Get the patient journey
      tags:
      - journeys
  /api/v1/journeys/{visitId}/claim:
    post:
      description: 'Records that the identity behind the patient session owns the
        visit by naming it (#96) — demo deployments only (ALLOW_DEMO_AUTH): production
        mints ownership through the slip-held link token instead (POST /api/v1/journeys/claim,
        #136). Idempotent; a visit that was never projected answers 404, indistinguishable
        from the journey read''s unknown-visit 404.'
      parameters:
      - description: Visit id
        in: path
        name: visitId
        required: true
        type: string
      responses:
        "204":
          description: No content
        "401":
          description: missing or invalid patient session
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: visit not projected
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Claim a visit for this session's identity
      tags:
      - auth
  /api/v1/journeys/{visitId}/clinics/{clinicCode}/close-round:
    post:
      description: 'Staff override (ADR-0009 §4): confirms the visit''s latest round
        at this clinic is finished, dropping any not-yet-started inferred return,
        without waiting for the HIS''s encounter.completed fact.'
      parameters:
      - description: Visit ID
        in: path
        name: visitId
        required: true
        type: string
      - description: Clinic code
        in: path
        name: clinicCode
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/journey.View'
        "404":
          description: visit not found, journey not projected, or no open round at
            this clinic
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Close a clinic round
      tags:
      - journeys
  /api/v1/journeys/{visitId}/location:
    get:
      description: 'The latest recorded location observation of the visit (QR scan,
        Zigbee fix, manual pick) — the canonical start point for routing. Patient-surface
        (#96): the session must have claimed the visit.'
      parameters:
      - description: Visit ID
        in: path
        name: visitId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/location.Observation'
        "401":
          description: missing or invalid patient session
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: no location recorded yet, visit unknown, or not claimed by
            this session
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Get the visit's current location
      tags:
      - location
    post:
      consumes:
      - application/json
      description: 'Records a location fix for the visit and makes it the current
        location. The raw payload is the scanned string (a CarePath location QR carries
        a place reference only — never patient data); the server resolves it through
        the matching provider to a canonical navigation node and returns the recorded
        observation. Patient-surface (#96): the session must have claimed the visit.'
      parameters:
      - description: Visit ID
        in: path
        name: visitId
        required: true
        type: string
      - description: 'Scanned fix: source (e.g. QR) and raw payload'
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/location.reportRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/location.Observation'
        "400":
          description: invalid body, unknown source, or a fix that does not resolve
            to a known location
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: missing or invalid patient session
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: visit unknown, or not claimed by this session — indistinguishable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Report a scanned location fix
      tags:
      - location
  /api/v1/journeys/{visitId}/notifications:
    get:
      description: 'FR-21 (#104): whether queue-proximity notifications are enabled
        for this visit. No stored preference means enabled. Patient-surface (#96):
        the session''s identity must have claimed the visit.'
      parameters:
      - description: Visit ID
        in: path
        name: visitId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/notification.Pref'
        "404":
          description: unknown visit
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Read the visit's queue-notification preference
      tags:
      - notifications
    put:
      consumes:
      - application/json
      description: 'FR-21 (#104): enable or disable queue-proximity notifications
        for this visit. The change takes effect on the next sweep. Patient-surface
        (#96): the session''s identity must have claimed the visit.'
      parameters:
      - description: Visit ID
        in: path
        name: visitId
        required: true
        type: string
      - description: The toggle
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/notification.setRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/notification.Pref'
        "400":
          description: invalid body
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: unknown visit
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Set the visit's queue-notification preference
      tags:
      - notifications
  /api/v1/journeys/{visitId}/queue:
    get:
      description: 'FR-17: for every currently-actionable step bound to a service
        point, how many people are waiting ahead of this patient there right now,
        and that point''s average experienced wait so far today. Averages over zero
        samples are null, not 0 — "no data yet" and "zero minutes" are different facts,
        and the client must not render a guess. estimatedWaitMinutes is the naive
        product of the two, null whenever the average is null. Patient-surface (#96):
        the session''s identity must have claimed this visit; an unclaimed or unknown
        visit answers the same 404 as the journey read.'
      parameters:
      - description: Visit ID
        in: path
        name: visitId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/journey.QueueView'
        "401":
          description: missing or invalid patient session
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: visit unknown, or not claimed by this session — indistinguishable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Get the patient queue picture for the next steps
      tags:
      - journeys
  /api/v1/journeys/{visitId}/share:
    delete:
      description: Revokes every still-active share link of the visit. Idempotent
        — 204 whether or not any link existed.
      parameters:
      - description: Visit id
        in: path
        name: visitId
        required: true
        type: string
      responses:
        "204":
          description: No content
        "401":
          description: missing or invalid patient session
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Stop sharing a visit ("หยุดแชร์")
      tags:
      - share
    post:
      description: 'Mints a read-only, time-limited link token (ADR-0011). Returns
        the raw token exactly once — store sha256 only — plus its expiry. The response
        carries no URL: the web app composes /shared#<token> itself so the API never
        needs its own origin. At most 5 active links per visit (409 beyond).'
      parameters:
      - description: Visit id
        in: path
        name: visitId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/share.LinkSecret'
        "401":
          description: missing or invalid patient session
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: visit not projected
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: active-link cap reached
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Create a relative share link for a visit
      tags:
      - share
  /api/v1/journeys/{visitId}/steps/{stepKey}/transition:
    post:
      consumes:
      - application/json
      description: Staff command that sets one step's status directly (ADR-0009 —
        CarePath owns step status; never forwarded to the HIS) and returns the refreshed
        journey with the plan recomputed. commandId is an optional idempotency key;
        source names the acting surface for the audit trail.
      parameters:
      - description: Visit ID
        in: path
        name: visitId
        required: true
        type: string
      - description: Step key
        in: path
        name: stepKey
        required: true
        type: string
      - description: Transition command
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/journey.transitionRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/journey.View'
        "400":
          description: invalid body or unknown target status
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: visit or step not found, or journey not projected
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: illegal transition
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "502":
          description: upstream HIS error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Transition one step
      tags:
      - journeys
  /api/v1/journeys/claim:
    post:
      consumes:
      - application/json
      description: 'Exchanges the slip-held link token (#136) for the visit it addresses
        and records the #96 claim — the identity behind the patient session becomes
        the visit''s owner, exactly as typing a VN used to do on demo deployments.
        The token rides the request body, never a URL. Unknown, rotated, cancelled,
        past-grace, and secret-rotated tokens all answer the journey read''s 404.'
      parameters:
      - description: 'the vt token from the slip URL''s #vt= fragment'
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/visitlink.redeemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/visitlink.redeemResponse'
        "401":
          description: missing or invalid patient session
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: visit unknown or link not redeemable — indistinguishable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Redeem a visit link token for this session
      tags:
      - auth
  /api/v1/navigation/edges:
    get:
      description: '#105/ADR-0015: the graph''s directed, costed edges. Two-way connections
        are two rows (A→B and B→A) and a cross-floor transition is an edge whose endpoints
        sit on different floors, so this is the whole walkable graph, not a per-floor
        slice.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/navigation.NavEdge'
            type: array
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: List navigation edges
      tags:
      - navigation
  /api/v1/navigation/nodes:
    get:
      description: '#105/ADR-0015: the graph''s nodes, which apps/web used to read
        from a build-time copy of packages/floorplans/graphs. The QR stickers staff
        print for lifts, stairs and entrances are derived from this list, so a stale
        copy sends patients to nodes that no longer exist — which is why the copy
        had to go.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/navigation.NavNode'
            type: array
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: List navigation nodes
      tags:
      - navigation
  /api/v1/navigation/route:
    get:
      description: Shortest walkable route for the SVG overlay. from is the current
        location's navigation node id — the nodeId of a location observation (e.g.
        I-1301/node-reception); to is the destination service point's code, which
        the server resolves to the place's entry node before routing.
      parameters:
      - description: Current location node id (e.g. I-1301/node-reception)
        in: query
        name: from
        required: true
        type: string
      - description: Destination service point code (e.g. PHARMACY)
        in: query
        name: to
        required: true
        type: string
      - description: Skip non-accessible edges (stairs) so the route detours via the
          elevator (FR-20)
        in: query
        name: accessibleOnly
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/navigation.Route'
        "400":
          description: missing from or to, or accessibleOnly is not a boolean
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: unknown node or service point, destination without a mapped
            place, or no walkable path
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Get the walking route to a service point
      tags:
      - navigation
  /api/v1/places:
    get:
      description: '#105: every place in the hospital map with its floor resolved
        — the destinations a service point can be mapped to. Already reachable one
        at a time through a service point''s resolved place; this is the whole set,
        for choosing among them. A place whose plan has not drawn it yet is still
        listed: it is selectable, just not routable.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/hospitalmap.Place'
            type: array
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: List places
      tags:
      - places
  /api/v1/service-points:
    get:
      description: Active service points with their resolved place and floor — the
        service → destination mapping patients navigate by and staff see in the console.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/servicepoint.ServicePoint'
            type: array
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: List service points
      tags:
      - service-points
  /api/v1/service-points/{code}:
    get:
      description: One active service point (e.g. code LAB) with its resolved place
        and floor — the destination lookup for a care step's service code.
      parameters:
      - description: Service code (e.g. REGISTRATION, DOCTOR, LAB, XRAY, PHARMACY)
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/servicepoint.ServicePoint'
        "404":
          description: service point not found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Get a service point by code
      tags:
      - service-points
  /api/v1/shared/journey:
    get:
      description: 'Resolves the share token (Authorization: Bearer) to the redacted
        SharedJourney — current step as Thai text, coarse status, service point name
        and floor, nothing else (ADR-0011 §3). Unknown, expired, and revoked tokens
        all answer with the same 401.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/share.SharedJourney'
        "401":
          description: invalid, expired, or revoked share token
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - shareAuth: []
      summary: Read the journey a share link points to
      tags:
      - share
  /api/v1/staff/my/service-points:
    get:
      description: 'FR-15/#102: the caller''s assigned service points (user_service_point),
        with resolved place and floor — the picker for the staff queue console. ADMIN
        sees every active point; STAFF sees only the points assigned to them.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/servicepoint.ServicePoint'
            type: array
        "401":
          description: missing, malformed, or expired staff access token
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: authenticated, but the user's roles do not allow this action
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - bearerAuth: []
      summary: List the service points the caller may work
      tags:
      - staff
  /api/v1/staff/planning-rules:
    get:
      description: 'FR-13/US-16: the rules the planner actually runs on — the phase
        ladder (ADR-0009 §3), the order-type → step-kind mapping, and worked examples
        computed by the real Plan function. Read-only: editing rules is a code change,
        not a request. Codes only (ADR-0012); display text lives in the client.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/journey.PlanningRules'
        "401":
          description: missing, malformed, or expired staff access token
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: authenticated, but the user's roles do not allow this action
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Get the journey planning rules
      tags:
      - staff
  /api/v1/staff/queue/{servicePointId}:
    get:
      description: 'FR-15/#102: who is being served (STARTED) and who is waiting (READY,
        longest-waiting first) at the service point, with patient detail and arrival/call
        times from the timeline. Patient-level data on the staff surface only (NFR-03)
        — never analytics. STAFF sees only points they are assigned to (user_service_point);
        ADMIN may read any point. Not assigned reads as 403, including a point id
        that does not exist.'
      parameters:
      - description: Service point ID (from /staff/my/service-points)
        in: path
        name: servicePointId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/journey.StationQueue'
        "401":
          description: missing, malformed, or expired staff access token
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: authenticated, but not assigned to this service point
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      security:
      - bearerAuth: []
      summary: Get one service point's working queue
      tags:
      - staff
  /api/v1/staff/visits:
    get:
      description: Every projected journey, freshest sync first — the same per-visit
        shape as the single-journey read. Reads the CarePath projection only; a visit
        not yet ingested is absent until its first fact lands.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/journey.View'
            type: array
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: List visits for the staff monitor
      tags:
      - staff
  /health:
    get:
      description: Liveness probe for the API.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.HealthResponse'
      summary: Health check
      tags:
      - health
swagger: "2.0"
