basePath: /
definitions:
  his.VisitStep:
    properties:
      sequence:
        type: integer
      serviceCode:
        type: string
      status:
        type: string
    type: object
  httpx.ErrorResponse:
    properties:
      error:
        example: visit not found
        type: string
    type: object
  journey.StepView:
    properties:
      sequence:
        type: integer
      serviceCode:
        type: string
      servicePoint:
        $ref: '#/definitions/servicepoint.ServicePoint'
      servicePointId:
        type: string
      status:
        type: string
    type: object
  journey.View:
    properties:
      completed:
        type: boolean
      current:
        $ref: '#/definitions/journey.StepView'
      next:
        $ref: '#/definitions/journey.StepView'
      patientRef:
        type: string
      status:
        type: string
      steps:
        items:
          $ref: '#/definitions/journey.StepView'
        type: array
      syncedAt:
        type: string
      visitId:
        type: string
    type: object
  main.HealthResponse:
    properties:
      service:
        example: carepath-api
        type: string
      status:
        example: ok
        type: string
    type: object
  servicepoint.ServicePoint:
    properties:
      code:
        type: string
      id:
        type: string
      name:
        type: string
      placeId:
        type: string
    type: object
  session.createRequest:
    properties:
      idToken:
        type: string
      source:
        type: string
    type: object
  session.createResponse:
    properties:
      expiresAt:
        type: string
      identity:
        $ref: '#/definitions/session.identityResponse'
      sessionToken:
        type: string
    type: object
  session.identityResponse:
    properties:
      displayName:
        type: string
      externalId:
        type: string
      source:
        type: string
    type: object
  visit.NextStep:
    properties:
      sequence:
        type: integer
      servicePoint:
        $ref: '#/definitions/servicepoint.ServicePoint'
      status:
        type: string
    type: object
  visit.VisitView:
    properties:
      next:
        $ref: '#/definitions/visit.NextStep'
      patientRef:
        type: string
      status:
        type: string
      steps:
        items:
          $ref: '#/definitions/his.VisitStep'
        type: array
      visitId:
        type: string
    type: object
info:
  contact: {}
  description: |-
    Patient journey and indoor navigation API above the HIS.
    Serves the normalized visit view with the next actionable
    step and its service point.
  title: CarePath API
  version: 1.0.0
paths:
  /api/v1/auth/session:
    get:
      description: 'Resolves the Authorization: Bearer session token to the identity
        behind it.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/session.identityResponse'
        "401":
          description: session not found or expired
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Get the current session identity
      tags:
      - auth
    post:
      consumes:
      - application/json
      description: Exchanges a LINE ID token (or, when enabled, a demo identity) for
        an opaque CarePath session token.
      parameters:
      - description: 'source: line|demo, idToken: the LINE ID token (ignored for demo)'
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/session.createRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/session.createResponse'
        "400":
          description: invalid request body
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: invalid identity token, or demo auth disabled
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Create a patient session
      tags:
      - auth
  /api/v1/journeys/{visitId}:
    get:
      description: 'Returns the CarePath-owned journey projection: steps ordered by
        sequence, each resolved to its service point, with the deterministic current
        (first STARTED) and next (first READY) step. A completed visit is reported
        with completed=true and no current/next.'
      parameters:
      - description: Visit ID
        in: path
        name: visitId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/journey.View'
        "404":
          description: no journey projected for this visit
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Get the patient journey
      tags:
      - journeys
  /api/v1/visits/{visitId}:
    get:
      description: Returns the HIS visit enriched with the next actionable step and
        its service point.
      parameters:
      - description: Visit ID
        in: path
        name: visitId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/visit.VisitView'
        "400":
          description: invalid input
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: visit not found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "502":
          description: upstream HIS error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Get normalized visit view
      tags:
      - visits
  /api/v1/visits/{visitId}/next:
    get:
      description: Returns the first READY step of the visit resolved to its service
        point.
      parameters:
      - description: Visit ID
        in: path
        name: visitId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/visit.NextStep'
        "400":
          description: invalid input
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: visit not found or no next actionable step
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "502":
          description: upstream HIS error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Get next actionable step
      tags:
      - visits
  /health:
    get:
      description: Liveness probe for the API.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.HealthResponse'
      summary: Health check
      tags:
      - health
swagger: "2.0"
