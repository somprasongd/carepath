basePath: /
definitions:
  auth.identityResponse:
    properties:
      displayName:
        type: string
      roles:
        items:
          type: string
        type: array
      userId:
        type: string
      username:
        type: string
    type: object
  auth.loginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  auth.refreshRequest:
    properties:
      refreshToken:
        type: string
    type: object
  auth.tokensResponse:
    properties:
      accessToken:
        type: string
      expiresAt:
        type: string
      identity:
        $ref: '#/definitions/auth.identityResponse'
      refreshExpiresAt:
        type: string
      refreshToken:
        type: string
    type: object
  hospitalmap.Floor:
    properties:
      buildingId:
        type: string
      code:
        type: string
      id:
        type: string
      levelOrder:
        type: integer
      name:
        type: string
    type: object
  hospitalmap.Place:
    properties:
      entryNodeId:
        type: string
      floor:
        $ref: '#/definitions/hospitalmap.Floor'
      floorId:
        type: string
      id:
        type: string
      name:
        type: string
      type:
        type: string
      x:
        type: number
      "y":
        type: number
    type: object
  httpx.ErrorResponse:
    properties:
      code:
        example: not_found
        type: string
      error:
        example: visit not found
        type: string
    type: object
  journey.StepView:
    properties:
      clinicCode:
        type: string
      kind:
        type: string
      orderRefs:
        items:
          type: string
        type: array
      round:
        type: integer
      sequence:
        type: integer
      servicePoint:
        $ref: '#/definitions/servicepoint.ServicePoint'
      servicePointId:
        type: string
      status:
        type: string
      stepKey:
        type: string
    type: object
  journey.View:
    properties:
      actionable:
        items:
          $ref: '#/definitions/journey.StepView'
        type: array
      completed:
        type: boolean
      patientName:
        type: string
      patientRef:
        type: string
      recommended:
        $ref: '#/definitions/journey.StepView'
      status:
        type: string
      steps:
        items:
          $ref: '#/definitions/journey.StepView'
        type: array
      syncedAt:
        type: string
      visitId:
        type: string
    type: object
  journey.transitionRequestBody:
    properties:
      commandId:
        type: string
      source:
        type: string
      to:
        type: string
    type: object
  location.Observation:
    properties:
      confidence:
        type: number
      floorId:
        type: string
      nodeId:
        type: string
      observedAt:
        type: string
      source:
        $ref: '#/definitions/location.Source'
      visitId:
        type: string
      zone:
        type: string
    type: object
  location.Source:
    enum:
    - QR
    - ZIGBEE
    - MANUAL
    type: string
    x-enum-comments:
      SourceManual: 'fallback/debug: a human-picked node'
      SourceQR: 'MVP baseline: a scanned CarePath QR code'
      SourceZigbee: 'phase 2: positioning service over Zigbee tags'
    x-enum-varnames:
    - SourceQR
    - SourceZigbee
    - SourceManual
  location.reportRequestBody:
    properties:
      raw:
        type: string
      source:
        type: string
    type: object
  location.zigbeeSimulatorRequestBody:
    properties:
      confidence:
        type: number
      floorId:
        type: string
      visitId:
        type: string
      zone:
        type: string
    type: object
  main.HealthResponse:
    properties:
      service:
        example: carepath-api
        type: string
      status:
        example: ok
        type: string
    type: object
  navigation.NavEdge:
    properties:
      accessible:
        type: boolean
      distance:
        type: number
      edgeType:
        description: CORRIDOR, ELEVATOR, STAIRS
        type: string
      fromNodeId:
        type: string
      id:
        type: string
      toNodeId:
        type: string
    type: object
  navigation.NavNode:
    properties:
      floorId:
        type: string
      id:
        type: string
      nodeType:
        description: ENTRANCE, PLACE_ENTRY, CORRIDOR, ELEVATOR, STAIRS
        type: string
      x:
        type: number
      "y":
        type: number
      zone:
        type: string
    type: object
  navigation.Route:
    properties:
      nodes:
        items:
          $ref: '#/definitions/navigation.NavNode'
        type: array
      segments:
        items:
          $ref: '#/definitions/navigation.NavEdge'
        type: array
      totalDistance:
        type: number
    type: object
  servicepoint.ServicePoint:
    properties:
      code:
        type: string
      id:
        type: string
      name:
        type: string
      place:
        $ref: '#/definitions/hospitalmap.Place'
      placeId:
        type: string
    type: object
  session.createRequest:
    properties:
      idToken:
        type: string
      source:
        type: string
    type: object
  session.createResponse:
    properties:
      expiresAt:
        type: string
      identity:
        $ref: '#/definitions/session.identityResponse'
      sessionToken:
        type: string
    type: object
  session.identityResponse:
    properties:
      displayName:
        type: string
      externalId:
        type: string
      source:
        type: string
    type: object
info:
  contact: {}
  description: |-
    Patient journey and indoor navigation API above the HIS.
    Serves the CarePath-derived journey plan (ADR-0009) with
    every actionable step resolved to its service point.
  title: CarePath API
  version: 1.0.0
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Verifies a username against an argon2id password hash and returns
        a short-lived JWT access token plus a rotating opaque refresh token. Unknown
        username, wrong password, and deactivated account are deliberately indistinguishable
        (same 401 body, same timing).
      parameters:
      - description: username and password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.tokensResponse'
        "400":
          description: invalid request body
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: invalid credentials
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Staff/admin login
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Revokes the presented refresh token. Idempotent — an unknown, expired
        or already-revoked token also returns 204, so a client can always clear its
        own state.
      responses:
        "204":
          description: No content
        "400":
          description: invalid request body
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Log out
      tags:
      - auth
  /api/v1/auth/me:
    get:
      description: The staff/admin identity and role codes behind the presented access
        token. The console calls it on boot to restore a session from a stored refresh
        token.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.identityResponse'
        "401":
          description: missing, malformed, or expired access token
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: The current staff identity
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: 'Exchanges a refresh token for a new access + refresh pair; the
        presented token is spent. Presenting an already-spent token is treated as
        a leak: every refresh token of that user is revoked and the call returns 401.'
      parameters:
      - description: the refresh token issued by login or a previous refresh
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.refreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.tokensResponse'
        "400":
          description: invalid request body
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: unknown, expired, revoked, or already-spent refresh token
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Refresh the token pair
      tags:
      - auth
  /api/v1/auth/session:
    get:
      description: 'Resolves the Authorization: Bearer session token to the identity
        behind it.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/session.identityResponse'
        "401":
          description: session not found or expired
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Get the current session identity
      tags:
      - auth
    post:
      consumes:
      - application/json
      description: Exchanges a LINE ID token (or, when enabled, a demo identity) for
        an opaque CarePath session token.
      parameters:
      - description: 'source: line|demo, idToken: the LINE ID token (ignored for demo)'
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/session.createRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/session.createResponse'
        "400":
          description: invalid request body
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: invalid identity token, or demo auth disabled
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Create a patient session
      tags:
      - auth
  /api/v1/demo/zigbee/location:
    post:
      consumes:
      - application/json
      description: 'Demo-only simulator for the Zigbee positioning service (#33):
        reports a zone-level fix for the visit through the canonical ZIGBEE location
        provider and returns the recorded observation. The zone resolves to its representative
        navigation node, which becomes the routing start point like any other location.
        A real Zigbee integration will consume positioning-service pushes through
        a separate adapter, not this endpoint.'
      parameters:
      - description: 'Simulated zone fix: visitId, floorId, zone, optional confidence'
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/location.zigbeeSimulatorRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/location.Observation'
        "400":
          description: invalid body, or a floor/zone that does not resolve to a known
            location
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Simulate a Zigbee zone fix
      tags:
      - location
  /api/v1/journeys/{visitId}:
    get:
      description: 'Returns the CarePath-derived journey plan (ADR-0009): steps in
        display order, each resolved to its service point, with every currently-actionable
        step and CarePath''s recommendation among them. A completed visit is reported
        with completed=true and no actionable steps.'
      parameters:
      - description: Visit ID
        in: path
        name: visitId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/journey.View'
        "404":
          description: no journey projected for this visit
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Get the patient journey
      tags:
      - journeys
  /api/v1/journeys/{visitId}/clinics/{clinicCode}/close-round:
    post:
      description: 'Staff override (ADR-0009 §4): confirms the visit''s latest round
        at this clinic is finished, dropping any not-yet-started inferred return,
        without waiting for the HIS''s encounter.completed fact.'
      parameters:
      - description: Visit ID
        in: path
        name: visitId
        required: true
        type: string
      - description: Clinic code
        in: path
        name: clinicCode
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/journey.View'
        "404":
          description: visit not found, journey not projected, or no open round at
            this clinic
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Close a clinic round
      tags:
      - journeys
  /api/v1/journeys/{visitId}/location:
    get:
      description: The latest recorded location observation of the visit (QR scan,
        Zigbee fix, manual pick) — the canonical start point for routing.
      parameters:
      - description: Visit ID
        in: path
        name: visitId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/location.Observation'
        "404":
          description: no location recorded for this visit yet
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Get the visit's current location
      tags:
      - location
    post:
      consumes:
      - application/json
      description: Records a location fix for the visit and makes it the current location.
        The raw payload is the scanned string (a CarePath location QR carries a place
        reference only — never patient data); the server resolves it through the matching
        provider to a canonical navigation node and returns the recorded observation.
      parameters:
      - description: Visit ID
        in: path
        name: visitId
        required: true
        type: string
      - description: 'Scanned fix: source (e.g. QR) and raw payload'
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/location.reportRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/location.Observation'
        "400":
          description: invalid body, unknown source, or a fix that does not resolve
            to a known location
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Report a scanned location fix
      tags:
      - location
  /api/v1/journeys/{visitId}/steps/{stepKey}/transition:
    post:
      consumes:
      - application/json
      description: Staff command that sets one step's status directly (ADR-0009 —
        CarePath owns step status; never forwarded to the HIS) and returns the refreshed
        journey with the plan recomputed. commandId is an optional idempotency key;
        source names the acting surface for the audit trail.
      parameters:
      - description: Visit ID
        in: path
        name: visitId
        required: true
        type: string
      - description: Step key
        in: path
        name: stepKey
        required: true
        type: string
      - description: Transition command
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/journey.transitionRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/journey.View'
        "400":
          description: invalid body or unknown target status
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: visit or step not found, or journey not projected
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: illegal transition
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "502":
          description: upstream HIS error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Transition one step
      tags:
      - journeys
  /api/v1/navigation/route:
    get:
      description: Shortest walkable route for the SVG overlay. from is the current
        location's navigation node id — the nodeId of a location observation (e.g.
        I-1301/node-reception); to is the destination service point's code, which
        the server resolves to the place's entry node before routing.
      parameters:
      - description: Current location node id (e.g. I-1301/node-reception)
        in: query
        name: from
        required: true
        type: string
      - description: Destination service point code (e.g. PHARMACY)
        in: query
        name: to
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/navigation.Route'
        "400":
          description: missing from or to
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: unknown node or service point, destination without a mapped
            place, or no walkable path
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Get the walking route to a service point
      tags:
      - navigation
  /api/v1/service-points:
    get:
      description: Active service points with their resolved place and floor — the
        service → destination mapping patients navigate by and staff see in the console.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/servicepoint.ServicePoint'
            type: array
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: List service points
      tags:
      - service-points
  /api/v1/service-points/{code}:
    get:
      description: One active service point (e.g. code LAB) with its resolved place
        and floor — the destination lookup for a care step's service code.
      parameters:
      - description: Service code (e.g. REGISTRATION, DOCTOR, LAB, XRAY, PHARMACY)
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/servicepoint.ServicePoint'
        "404":
          description: service point not found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Get a service point by code
      tags:
      - service-points
  /api/v1/staff/visits:
    get:
      description: Every projected journey, freshest sync first — the same per-visit
        shape as the single-journey read. Reads the CarePath projection only; a visit
        not yet ingested is absent until its first fact lands.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/journey.View'
            type: array
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: List visits for the staff monitor
      tags:
      - staff
  /health:
    get:
      description: Liveness probe for the API.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.HealthResponse'
      summary: Health check
      tags:
      - health
swagger: "2.0"
