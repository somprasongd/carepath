# Production-shaped stack: the edge proxy (infra/docker/proxy.conf) is the
# ONLY published port. Everything the browser needs shares that one origin:
#
#   /                     → web   (static SPA, internal)
#   /api/…                → api   (internal) — except the mock-his carve-outs
#   /console, demo paths  → mock-his (internal) — operator console over HTTPS
#
#   docker compose -f docker-compose.prod.yml up --build -d
#
# The web bundle is baked same-origin (client.ts defaults to a relative
# /api), so no API base needs configuring. Terminate TLS in front of
# CAREPATH_EDGE_PORT (or on a real domain) before pointing a LIFF endpoint
# at this stack — LIFF requires HTTPS outside localhost.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carepath}
      POSTGRES_USER: ${POSTGRES_USER:-carepath}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carepath}
    volumes:
      - carepath_pg_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carepath} -d ${POSTGRES_DB:-carepath}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-his:
    build:
      context: .
      dockerfile: infra/docker/mock-his.Dockerfile
    environment:
      PORT: 8090
      PATIENT_APP_BASE_URL: ${PATIENT_APP_BASE_URL:-}
      # Empty = same-origin: the console reads /api/v1/service-points through
      # the edge proxy alongside its own demo paths.
      CAREPATH_API_BASE_URL: ${CAREPATH_API_BASE_URL:-}
      # Slip-QR minting (ADR-0014) runs server-side over the docker network.
      # CAREPATH_HIS_API_KEY (same value as the api's HIS_API_KEY) switches
      # the console QR to minted #vt= links; empty keeps the legacy ?visit=.
      CAREPATH_API_INTERNAL_BASE_URL: ${CAREPATH_API_INTERNAL_BASE_URL:-http://api:8080}
      CAREPATH_HIS_API_KEY: ${CAREPATH_HIS_API_KEY:-}

  migrate:
    image: migrate/migrate:v4.18.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./infra/postgres/migrations:/migrations:ro
    command:
      # search_path=public pins golang-migrate's bookkeeping table to one
      # schema — see docker-compose.yml (dev) for the dirty-db story.
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-carepath}:${POSTGRES_PASSWORD:-carepath}@postgres:5432/${POSTGRES_DB:-carepath}?sslmode=disable&search_path=public
      - up

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-carepath}:${POSTGRES_PASSWORD:-carepath}@postgres:5432/${POSTGRES_DB:-carepath}?sslmode=disable
      HIS_BASE_URL: ${HIS_BASE_URL:-http://mock-his:8090}
      HIS_INGEST_INTERVAL: ${HIS_INGEST_INTERVAL:-5s}
      LINE_CHANNEL_ID: ${LINE_CHANNEL_ID:-}
      ALLOW_DEMO_AUTH: ${ALLOW_DEMO_AUTH:-false}
      SESSION_TTL: ${SESSION_TTL:-24h}
      JWT_SECRET: ${JWT_SECRET:-}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-168h}
      # Visit link (ADR-0014): routes register only when HIS_API_KEY and
      # VISIT_LINK_SECRET are both set (fail-closed). PATIENT_APP_BASE_URL
      # has no request to derive an origin from (server-to-server mint), so
      # prod MUST set it to the public origin or slip QRs point at
      # localhost.
      HIS_API_KEY: ${HIS_API_KEY:-}
      VISIT_LINK_SECRET: ${VISIT_LINK_SECRET:-}
      VISIT_LINK_COMPLETED_GRACE: ${VISIT_LINK_COMPLETED_GRACE:-30m}
      PATIENT_APP_BASE_URL: ${PATIENT_APP_BASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mock-his:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: infra/docker/web-prod.Dockerfile
    depends_on:
      - api

  proxy:
    build:
      context: .
      dockerfile: infra/docker/proxy.Dockerfile
    ports:
      - "${CAREPATH_EDGE_PORT:-80}:80"
    depends_on:
      - web
      - api
      - mock-his

volumes:
  carepath_pg_prod:
