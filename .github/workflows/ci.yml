name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [apps/api, apps/mock-his]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: carepath
          POSTGRES_USER: carepath
          POSTGRES_PASSWORD: carepath
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carepath -d carepath"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work

      - name: Apply database migrations
        if: matrix.module == 'apps/api'
        run: |
          sudo apt-get -yq install postgresql-client >/dev/null
          for f in ../../infra/postgres/migrations/*.up.sql; do
            echo "applying $f"
            psql "postgres://carepath:carepath@localhost:5432/carepath?sslmode=disable" \
              -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: gofmt check
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "Not gofmt'ed:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        env:
          DATABASE_URL: ${{ matrix.module == 'apps/api' && 'postgres://carepath:carepath@localhost:5432/carepath?sslmode=disable' || '' }}
        run: go test ./...

  web:
    name: Web (apps/web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint:web

      - name: Test
        run: npm run test:web

      - name: Build
        run: npm run build:web
