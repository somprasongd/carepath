openapi: 3.1.0
info:
  title: CarePath API
  version: 0.14.0
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      responses:
        '200':
          description: Healthy
  /api/v1/auth/session:
    post:
      description: >
        Exchanges a LINE ID token (source "line"), or a demo identity (source
        "demo", only when the server has ALLOW_DEMO_AUTH enabled), for an
        opaque CarePath session token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSessionResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid identity token, or demo auth disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      description: Resolves the Authorization Bearer session token to the identity behind it.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current session identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        '401':
          description: Session not found or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/login:
    post:
      description: >
        Staff/admin login (ADR-0010, FR-18). Verifies a username against an
        argon2id password hash and returns a short-lived JWT access token
        plus a rotating opaque refresh token. Patients never use this
        endpoint — they authenticate through POST /api/v1/auth/session with a
        LINE identity. An unknown username, a wrong password and a
        deactivated account are deliberately indistinguishable: all three
        return the same 401 body, and the server spends the same time on all
        three.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/refresh:
    post:
      description: >
        Exchanges a refresh token for a new access + refresh pair (ADR-0010
        §4). Refresh tokens are single-use — this call spends the presented
        one. Presenting an already-spent token is treated as a leak: every
        refresh token belonging to that user is revoked and the call returns
        401, forcing a real login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: A new token pair; the presented refresh token is now spent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unknown, expired, revoked, or already-spent refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/logout:
    post:
      description: >
        Revokes the presented refresh token. Idempotent — an unknown,
        expired or already-revoked token also returns 204, so a client can
        always clear its own state. The access token is stateless and stays
        valid until it expires (at most ACCESS_TOKEN_TTL, default 15
        minutes).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '204':
          description: Logged out
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/me:
    get:
      description: >
        The staff/admin identity and role codes behind the presented access
        token (ADR-0010). The web console calls it on boot to restore a
        session from a stored refresh token.
      security:
        - staffAuth: []
      responses:
        '200':
          description: The authenticated staff identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffIdentity'
        '401':
          description: Missing, malformed, or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/journeys/{visitId}:
    get:
      description: >
        The patient journey: the CarePath-owned plan derived from HIS facts
        (ADR-0009) — CarePath, not the HIS, decides which steps exist and
        their order. Steps are exposed by `sequence` (display order; not a
        stable identity — replanning may renumber) and `stepKey` (the stable
        identity to address a step by). Patient surface (#96): the patient
        session's identity must have claimed this visit (POST
        /api/v1/journeys/{visitId}/claim — naming the VN is the claim
        credential). A visit that is unknown, unprojected, or claimed by
        another identity all answer the same 404.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: visitId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The projected journey
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Journey'
        '401':
          description: Missing, malformed, or invalid patient session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Visit unknown, not projected, or not claimed by this
            session — indistinguishable by design
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/journeys/{visitId}/claim:
    post:
      description: >
        Mint visit ownership for this session's identity (#96): records that
        the identity behind the patient session may read this visit. Naming
        the VN is the credential, matching the patient front door. Idempotent
        — re-claiming a visit this identity already owns succeeds. This is
        the only way read access to a journey is granted.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: visitId
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Claim recorded (or already owned by this identity)
        '401':
          description: Missing, malformed, or invalid patient session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Visit unknown or not projected — the same 404 the
            journey read gives
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/journeys/{visitId}/steps/{stepKey}/transition:
    post:
      description: >
        Staff command: transition one step's status (ADR-0009 — CarePath owns
        step status; this no longer forwards to the HIS). Used by the
        service-point console to mark a step arrived/in-progress/completed
        (FR-15) or cancelled. Returns the refreshed journey with the plan
        recomputed against the new fact — completing a diagnostic step, for
        instance, may not yet make its follow-up clinic step actionable if the
        order hasn't resulted (ADR-0009 §5). commandId is an optional
        caller-assigned idempotency key (a fresh UUID is generated when
        absent); source names the acting surface for the audit trail, while
        the authenticated user behind the token is recorded as the actor
        (ADR-0010 §11, NFR-09).
      security:
        - staffAuth: []
      parameters:
        - in: path
          name: visitId
          required: true
          schema: { type: string }
        - in: path
          name: stepKey
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionRequest'
      responses:
        '200':
          description: The refreshed journey after applying the command
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Journey'
        '400':
          description: Invalid body or unknown target status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, malformed, or expired staff access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Authenticated, but the user's roles do not allow this action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Visit or step not found, or journey not projected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Illegal transition (e.g. from a terminal status, or the step is not yet READY)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/journeys/{visitId}/clinics/{clinicCode}/close-round:
    post:
      description: >
        Staff override (ADR-0009 §4): the clinic confirms this round of
        seeing the patient is finished, even though the HIS has not (yet, or
        ever) reported `encounter.completed`. Equivalent in effect to that
        fact arriving — any not-yet-started "return to this clinic" step the
        planner inferred is dropped. Use when a doctor orders a test for a
        future visit rather than this one, or when the connected HIS cannot
        emit `encounter.completed` at all.
      security:
        - staffAuth: []
      parameters:
        - in: path
          name: visitId
          required: true
          schema: { type: string }
        - in: path
          name: clinicCode
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The refreshed journey after closing the round
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Journey'
        '401':
          description: Missing, malformed, or expired staff access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Authenticated, but the user's roles do not allow this action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Visit not found, journey not projected, or the visit has no open round at this clinic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/journeys/{visitId}/share:
    post:
      description: >
        Patient command (ADR-0011): mint a time-limited tracking link for
        this visit to hand to a relative. Requires a patient session
        (bearerAuth). The response carries the raw token exactly once —
        the server stores only its sha256, so it cannot be re-read. At
        most 5 active links per visit; creating beyond that fails with
        409 (revoke first). TTL defaults to 4h (SHARE_LINK_TTL).
        Since #96 the session's identity must have claimed the visit —
        sharing someone else's visit answers the journey read's 404.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: visitId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The minted link — token is shown this one time only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareLinkResponse'
        '401':
          description: Missing, malformed, or invalid patient session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Visit unknown, not projected, or not claimed by this
            session — indistinguishable by design
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Too many active share links for this visit (max 5)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      description: >
        Patient command (ADR-0011): revoke every active share link for
        this visit. Idempotent — revoking with nothing active is still
        204. Requires a patient session (bearerAuth) whose identity has
        claimed the visit (#96).
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: visitId
          required: true
          schema: { type: string }
      responses:
        '204':
          description: All active links revoked (or none existed)
        '401':
          description: Missing, malformed, or invalid patient session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/shared/journey:
    get:
      description: >
        The relative-facing answer (ADR-0011): what the shared holder may
        learn, and nothing more — the current (or next) step as a Thai
        title, a coarse status, and the service point's display name and
        floor. Unknown, expired, and revoked tokens are one and the same
        401: the surface must not confirm which links ever existed. This
        is the only surface shareAuth is valid on.
      security:
        - shareAuth: []
      responses:
        '200':
          description: The redacted shared journey
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedJourney'
        '401':
          description: Unknown, expired, or revoked share token (indistinguishable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/journeys/{visitId}/location:
    get:
      description: The visit's current location — the latest recorded
        location observation (QR scan today; Zigbee or manual later). This
        is the canonical start point for routing. Patient surface (#96) —
        the session's identity must have claimed the visit.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: visitId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Current location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationObservation'
        '401':
          description: Missing, malformed, or invalid patient session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No location recorded yet, or the visit is unknown /
            not claimed by this session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      description: Report a scanned location fix for the visit and record it
        as the current location. The raw payload is the scanned string — a
        CarePath location QR carries a place reference only, never patient
        data; the server resolves it to a canonical navigation node via the
        source's provider (ADR-0004). Patient surface (#96) — the session's
        identity must have claimed the visit.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: visitId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationReportRequest'
      responses:
        '200':
          description: The recorded observation, now the current location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationObservation'
        '400':
          description: Invalid body, unknown source, or a fix that does not
            resolve to a known location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, malformed, or invalid patient session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Visit unknown, not projected, or not claimed by this
            session — indistinguishable by design
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/demo/zigbee/location:
    post:
      description: >
        Demo-only Zigbee simulator (#33): reports a zone-level fix for the
        visit through the canonical ZIGBEE location provider (ADR-0004).
        The zone resolves to its representative navigation node, which
        becomes the routing start point like any other location. Stands in
        for the external positioning service of docs/integration/
        location-zigbee.md during demos; a real Zigbee integration will be
        a separate adapter consuming positioning pushes, not this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZigbeeSimulatorRequest'
      responses:
        '200':
          description: The recorded observation, now the current location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationObservation'
        '400':
          description: Invalid body, or a floor/zone that does not resolve
            to a known location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/service-points:
    get:
      description: >
        Active service points with their resolved place and floor (#24): the
        service → destination mapping patients navigate by and staff see in
        the console. Read-only — mapping changes go through seed migrations
        for the MVP (FR-11).
      responses:
        '200':
          description: All active service points, ordered by code
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ServicePoint' }
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/service-points/{code}:
    get:
      description: >
        One active service point by its binding code — a clinic code
        (`CLINIC:MED`), an order type (`ORDERTYPE:LAB`), or a fixed code
        (`REGISTRATION`, `CASHIER`, `PHARMACY`) — with the resolved place and
        floor (#24, extended by ADR-0009 for the new step vocabulary).
      parameters:
        - in: path
          name: code
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The service point
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePoint'
        '404':
          description: No active service point for this code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/staff/visits:
    get:
      description: >
        Staff visit monitor (#37): the projected journey of every visit
        CarePath knows, freshest sync first — the same per-visit shape as the
        single-journey read. Reads the CarePath projection only; a visit
        opened in the HIS but not yet ingested is absent until its first fact
        lands. Mounted under /api/v1/staff so the NFR-08 auth guard covers the
        whole group with one middleware (ADR-0010 §7).
      security:
        - staffAuth: []
      responses:
        '200':
          description: All projected journeys, newest sync first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Journey'
        '401':
          description: Missing, malformed, or expired staff access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Authenticated, but the user's roles do not allow this action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/analytics/overview:
    get:
      description: >
        Executive insights dashboard (#86, epic #83): operational metrics
        aggregated from the append-only step timeline
        (carepath.journey_step_status_event, #85) — never patient-level data
        (NFR-03). window=today means midnight-to-now in the configured
        analytics timezone (Asia/Bangkok by default), not the server's UTC
        clock. Executives get EXECUTIVE logins that reach this surface and
        nothing else (ADR-0010).
      security:
        - staffAuth: []
      parameters:
        - in: query
          name: window
          description: Aggregation window. Only "today" exists in the MVP;
            anything else is a 400.
          schema: { type: string, default: today, example: today }
      responses:
        '200':
          description: Aggregated overview for the requested window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsOverview'
        '400':
          description: Unsupported window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, malformed, or expired staff access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Authenticated, but the user's roles do not allow this action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/navigation/route:
    get:
      description: >
        Shortest walkable route for the SVG overlay (#29). `from` is the
        current location's navigation node id — the nodeId of a location
        observation (e.g. I-1301/node-reception) — and `to` is the
        destination service point's code (same key as
        /api/v1/service-points/{code}); the server resolves it to the
        place's entry node before routing.
      parameters:
        - in: query
          name: from
          required: true
          description: Globally unique navigation node id ("<floorId>/<localId>").
          schema: { type: string }
        - in: query
          name: to
          required: true
          description: Destination service point code, e.g. PHARMACY.
          schema: { type: string }
        - in: query
          name: accessibleOnly
          required: false
          description: >
            Skip edges not marked accessible (the stairs transitions) so
            wheelchair routes detour via the elevator instead (FR-20/US-09).
            Absent or false routes over the full graph.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Ordered route — nodes[0] is the origin, the last node the destination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NavigationRoute'
        '400':
          description: Missing or empty from/to, or accessibleOnly is not a boolean
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown node or service point, destination without a mapped place, or no walkable path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        A patient session token from POST /api/v1/auth/session — opaque,
        server-side, issued against a LINE identity.
    staffAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        A staff/admin JWT access token from POST /api/v1/auth/login or
        /api/v1/auth/refresh (ADR-0010). Distinct from bearerAuth: different
        subject, different store, different lifetime.
    shareAuth:
      type: http
      scheme: bearer
      description: >
        A visit share token from POST /api/v1/journeys/{visitId}/share
        (ADR-0011) — a third credential kind: visit-scoped, read-only,
        time-limited, revocable. Valid only on GET /api/v1/shared/journey;
        every other surface rejects it with 401, and it is never accepted in
        a URL or query string (NFR-08).
  schemas:
    Error:
      type: object
      description: Error envelope shared by all endpoints. code is the
        machine-readable apperr kind ("invalid", "unauthorized",
        "forbidden", "not_found", "conflict", "upstream", "internal") the
        frontend branches on; error is the human-safe message.
      required: [error, code]
      properties:
        error: { type: string }
        code: { type: string }
    LoginRequest:
      type: object
      description: Staff/admin credentials (ADR-0010). The demo deployment seeds
        admin/demo (ADMIN) and staff/demo (STAFF) — demo credentials only.
      required: [username, password]
      properties:
        username: { type: string, example: staff }
        password: { type: string, format: password, example: demo }
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    AuthTokens:
      type: object
      description: >
        The credential pair issued by login and refresh. accessToken is an
        HS256 JWT carrying sub/username/roles/typ=access; refreshToken is an
        opaque random string the server keeps only as a SHA-256 hash, and is
        spent by the next refresh.
      required: [accessToken, refreshToken, expiresAt, refreshExpiresAt, identity]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresAt:
          type: string
          format: date-time
          description: When accessToken expires (ACCESS_TOKEN_TTL, default 15m).
        refreshExpiresAt:
          type: string
          format: date-time
          description: When refreshToken expires (REFRESH_TOKEN_TTL, default 7d).
        identity: { $ref: '#/components/schemas/StaffIdentity' }
    StaffIdentity:
      type: object
      description: A staff/admin user. Not interchangeable with Identity, which
        describes a patient's external (LINE) identity.
      required: [userId, username, displayName, roles]
      properties:
        userId: { type: string }
        username: { type: string }
        displayName: { type: string }
        roles:
          type: array
          description: Role codes granted to this user (ADR-0010 §5). The console
            derives its landing screen and visible actions from these — a user
            never picks their own role.
          items:
            type: string
            enum: [ADMIN, STAFF]
    NavigationRoute:
      type: object
      description: Ordered shortest path between two nodes (#28). Nodes[0]
        is the origin, the last node the destination, and segments[i] is the
        edge walked from nodes[i] to nodes[i+1]; totalDistance sums the
        segment costs in authored SVG units, not metres.
      required: [nodes, segments, totalDistance]
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/NavNode'
        segments:
          type: array
          items:
            $ref: '#/components/schemas/NavEdge'
        totalDistance: { type: number }
    NavNode:
      type: object
      description: One walkable point of the hospital. x/y are floor-local
        SVG units, so the overlay groups consecutive nodes by floorId and
        draws a polyline per floor.
      required: [id, floorId, x, y, nodeType]
      properties:
        id: { type: string }
        floorId: { type: string }
        x: { type: number }
        y: { type: number }
        nodeType:
          type: string
          description: What kind of walkable point this is.
          enum: [ENTRANCE, PLACE_ENTRY, CORRIDOR, ELEVATOR, STAIRS]
        zone: { type: string }
    NavEdge:
      type: object
      description: One directed walk between neighbouring nodes; edgeType
        carries the turn-by-turn cue (corridor vs elevator vs stairs).
        Two-way walks are two segments.
      required: [id, fromNodeId, toNodeId, edgeType, distance, accessible]
      properties:
        id: { type: string }
        fromNodeId: { type: string }
        toNodeId: { type: string }
        edgeType:
          type: string
          enum: [CORRIDOR, ELEVATOR, STAIRS]
        distance: { type: number }
        accessible: { type: boolean }
    ServicePoint:
      type: object
      description: Links a service code to a physical Place in the hospital map.
        Place is the resolved destination (place + floor); null when the place
        is not in the map yet — the same explicit unmapped state as a null
        servicePoint on a journey step (#24).
      required: [id, code, name, placeId]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        placeId: { type: string }
        place:
          allOf:
            - $ref: '#/components/schemas/Place'
          nullable: true
    Place:
      type: object
      description: A physical place on a floor plan, keyed by the stable SVG
        place id that also keys the navigation graphs in packages/floorplans.
        x/y are floor-local SVG units of the place's entry node; entryNodeId
        references that node in the navigation graph (#26) as a
        floor-prefixed global id, e.g. I-1301/node-reception.
      required: [id, floorId, name, type, floor]
      properties:
        id: { type: string }
        floorId: { type: string }
        name: { type: string }
        type:
          type: string
          description: Place category from the hospital map.
          enum: [ROOM, COUNTER, WAITING_AREA, RESTROOM, ELEVATOR, STAIRWAY, RAMP, ENTRANCE, AMENITY]
        x: { type: number }
        y: { type: number }
        entryNodeId: { type: string }
        floor: { $ref: '#/components/schemas/Floor' }
    Floor:
      type: object
      description: One floor of a building, identified by the floor-plan id
        (e.g. I-1301).
      required: [id, buildingId, code, name, levelOrder]
      properties:
        id: { type: string }
        buildingId: { type: string }
        code: { type: string }
        name: { type: string }
        levelOrder: { type: integer }
    StepKind:
      type: string
      description: >
        What kind of step this is, for display and for resolving its service
        point binding (ADR-0009). `CLINIC` steps carry `clinicCode`; `LAB`,
        `XRAY`, `EKG`, `ULTRASOUND` steps carry `orderRefs`; `REGISTRATION`,
        `CASHIER`, `PHARMACY` are fixed, unique-per-visit steps.
      enum: [REGISTRATION, CLINIC, LAB, XRAY, EKG, ULTRASOUND, CASHIER, PHARMACY]
    JourneyStep:
      type: object
      description: One step of the journey plan CarePath derived from HIS facts (ADR-0009).
      required: [stepKey, sequence, kind, status, servicePointId]
      properties:
        stepKey:
          type: string
          description: >
            Stable identity for this step across replans (e.g. "CLINIC:MED:2",
            "LAB:ORD-118", "CASHIER"). Use this, not `sequence`, to address a
            step (transitions, tracking which step a screen is showing).
        sequence:
          type: integer
          description: Display order as of the current plan. Not stable across
            a replan — a step's sequence can change when facts change; its
            stepKey never does.
        kind: { $ref: '#/components/schemas/StepKind' }
        clinicCode:
          type: [string, "null"]
          description: Set when kind is CLINIC.
        round:
          type: [integer, "null"]
          description: 1-based visit count to this clinic within the visit; set when kind is CLINIC. A value above 1 means the patient is returning to a doctor they already saw this visit.
        orderRefs:
          type: array
          description: HIS order ids this step represents. Orders of the same
            type placed in the same round collapse into one step.
          items: { type: string }
        status:
          type: string
          description: >
            Canonical step status. WAITING means every action the patient can
            take is done (e.g. blood drawn) but the step is not yet actionable
            for what comes after it — waiting on `order.resulted` (ADR-0009 §5).
          enum: [PENDING, WAITING, READY, STARTED, COMPLETED, CANCELLED]
        servicePointId:
          type: [string, "null"]
          description: Bound service point id; null when no service point is configured for this step's binding key (explicit unmapped state).
        servicePoint:
          allOf:
            - $ref: '#/components/schemas/ServicePoint'
          nullable: true
          description: The bound service point, when configured and still active.
    Journey:
      type: object
      description: >
        The journey plan CarePath derived from one HIS visit's facts
        (ADR-0009). Steps in the same phase are not ordered against each
        other — a patient with both a lab and an X-ray before their clinic may
        do either first — so more than one step can be `actionable` at once.
      required: [visitId, patientRef, status, completed, steps, actionable, syncedAt]
      properties:
        visitId: { type: string }
        patientRef: { type: string }
        patientName:
          type: string
          description: Patient display name for staff screens (ADR-0009 §8); absent on patient-facing reads.
        status:
          type: string
          description: Canonical visit status.
          enum: [ACTIVE, COMPLETED, CANCELLED]
        completed:
          type: boolean
          description: True iff the visit status is COMPLETED — the unambiguous
            finished signal; actionable is empty and recommended is null in
            that case.
        steps:
          type: array
          description: All steps of the plan ordered by sequence.
          items: { $ref: '#/components/schemas/JourneyStep' }
        actionable:
          type: array
          description: Every step currently READY — what the patient could do
            right now, in any order.
          items: { $ref: '#/components/schemas/JourneyStep' }
        recommended:
          allOf:
            - $ref: '#/components/schemas/JourneyStep'
          nullable: true
          description: CarePath's pick among `actionable` for the
            patient-facing single primary action; null when actionable is
            empty. Today this is the first actionable step by sequence.
            Ranking it by distance or queue length (ADR-0009 §6) remains the
            intent, but is not implemented — it depends on the queue data of
            FR-17, which does not exist yet.
        syncedAt: { type: string, format: date-time }
    ShareLinkResponse:
      type: object
      description: >
        The one-time mint of a visit share link (ADR-0011). The token is
        the bearer credential the relative's device presents to
        GET /api/v1/shared/journey; the server keeps only its sha256, so
        this response is the last time anyone can read it.
      required: [token, expiresAt]
      properties:
        token:
          type: string
          description: 64-char hex share token — send as Authorization Bearer, never in a URL.
        expiresAt: { type: string, format: date-time }
    SharedJourney:
      type: object
      description: >
        The relative-facing read (ADR-0011 §3) — a deliberate disclosure
        list, not a redacted Journey: current step title, coarse status,
        where, and when. No patient name, no ids, no codes, no step list.
      required: [status, updatedAt, expiresAt]
      properties:
        status:
          type: string
          description: Coarse progress — the only status vocabulary on this surface.
          enum: [WAITING, IN_SERVICE, DONE]
        currentStep:
          allOf:
            - $ref: '#/components/schemas/SharedStep'
          nullable: true
          description: The step happening now, else the next one; null once the visit is DONE.
        updatedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    SharedStep:
      type: object
      description: One step as a relative may see it — display strings only.
      required: [title, status]
      properties:
        title:
          type: string
          description: Thai display title of the step kind (e.g. พบแพทย์, เจาะเลือด / ส่งตรวจแล็บ).
        status:
          type: string
          enum: [WAITING, IN_SERVICE, DONE]
        servicePointName:
          type: string
          description: Display name of the step's service point, code suffix stripped; absent when unmapped.
        floorName:
          type: string
          description: Floor display name (e.g. ชั้น 1); absent when unmapped.
    TransitionRequest:
      type: object
      description: The client-facing transition command (#19, amended by ADR-0009 — no longer forwarded to the HIS).
      required: [to]
      properties:
        to:
          type: string
          description: Target step status.
          enum: [STARTED, COMPLETED, CANCELLED]
        commandId:
          type: string
          format: uuid
          description: Optional caller-assigned idempotency key; generated when absent.
        source:
          type: string
          description: Acting surface for the audit trail, e.g. staff-web or patient-web. Defaults to unknown.
    Identity:
      type: object
      description: A verified external identity behind a CarePath session.
      required: [source, externalId]
      properties:
        source:
          type: string
          enum: [line, demo]
        externalId: { type: string }
        displayName: { type: string }
    CreateSessionRequest:
      type: object
      required: [source, idToken]
      properties:
        source:
          type: string
          enum: [line, demo]
        idToken:
          type: string
          description: The LINE ID token. Ignored (may be empty) for source "demo".
    CreateSessionResponse:
      type: object
      required: [sessionToken, identity, expiresAt]
      properties:
        sessionToken: { type: string }
        identity: { $ref: '#/components/schemas/Identity' }
        expiresAt: { type: string, format: date-time }
    LocationObservation:
      type: object
      description: The normalized current-location result every provider
        resolves onto (ADR-0004). nodeId is the canonical navigation node
        ("<floorId>/<localId>"); zone and confidence are optional — exact
        sources such as QR leave them unset.
      required: [visitId, nodeId, floorId, source, observedAt]
      properties:
        visitId: { type: string }
        nodeId: { type: string }
        floorId: { type: string }
        zone:
          type: [string, 'null']
          description: Positioning zone from the navigation graph, e.g. PUBLIC, OPD.
        source:
          type: string
          description: Which provider produced the fix — QR, ZIGBEE, or MANUAL.
        confidence:
          type: [number, 'null']
          description: 0..1 for probabilistic sources (Zigbee); null for exact ones.
        observedAt: { type: string, format: date-time }
    LocationReportRequest:
      type: object
      description: One scanned fix. raw is the payload exactly as scanned —
        opaque to the client; the server's provider resolves it.
      required: [source, raw]
      properties:
        source:
          type: string
          description: Provider source to resolve through, e.g. QR.
        raw: { type: string }
    ZigbeeSimulatorRequest:
      type: object
      description: One simulated Zigbee zone fix for the demo endpoint
        (#33) — where the visit's tag is and how confident the simulated
        positioning is.
      required: [visitId, floorId, zone]
      properties:
        visitId: { type: string }
        floorId: { type: string }
        zone:
          type: string
          description: Positioning zone on that floor, e.g. PUBLIC, WELLNESS.
        confidence:
          type: [number, 'null']
          description: Optional 0..1 confidence of the simulated fix.
    AnalyticsOverview:
      type: object
      description: >
        Executive overview for one window (#86). Every average is null —
        never 0 — when no sample exists for it: "no data yet" and "zero
        minutes" are different facts, and the dashboard renders null as an
        em dash rather than a misleading 0.
      required: [asOf, window, summary, servicePoints]
      properties:
        asOf: { type: string, format: date-time }
        window:
          type: string
          description: The window requested (and validated) — "today".
        summary: { $ref: '#/components/schemas/AnalyticsSummary' }
        servicePoints:
          type: array
          description: One entry per active service point, ordered by code.
          items: { $ref: '#/components/schemas/ServicePointMetrics' }
    AnalyticsSummary:
      type: object
      description: Visit-wide numbers for the window.
      required: [activeVisits, avgWaitMinutes, avgVisitMinutes, bottleneckServicePointId]
      properties:
        activeVisits:
          type: integer
          description: Visits currently ACTIVE (a "now" number, not windowed).
        avgWaitMinutes:
          type: [number, 'null']
          description: Average over steps that started within the window of
            (time entering STARTED − time entering READY the latest time
            before that). Null when no step started in the window.
        avgVisitMinutes:
          type: [number, 'null']
          description: Average of (last timeline event − first timeline
            event) over visits that are COMPLETED and whose last event falls
            within the window. Null when no visit finished.
        bottleneckServicePointId:
          type: [string, 'null']
          description: Service point with the highest avgWaitMinutes; ties
            break by waitingNow. Null when no service point has wait data.
    ServicePointMetrics:
      type: object
      description: Per-service-point operational metrics for the window.
      required: [servicePointId, code, name, waitingNow, inProgressNow, longestWaitingMinutes, avgWaitMinutes, avgServiceMinutes, completedCount]
      properties:
        servicePointId: { type: string }
        code: { type: string }
        name: { type: string }
        waitingNow:
          type: integer
          description: Steps currently READY and bound to this service point
            (a "now" number, from current state, not windowed).
        inProgressNow:
          type: integer
          description: Steps currently STARTED and bound to this service
            point ("now", not windowed).
        longestWaitingMinutes:
          type: [number, 'null']
          description: now − (time the still-READY step entered READY),
            longest among currently waiting steps. Null when nobody is
            waiting.
        avgWaitMinutes:
          type: [number, 'null']
          description: Same definition as AnalyticsSummary.avgWaitMinutes,
            restricted to this service point. Null when no sample.
        avgServiceMinutes:
          type: [number, 'null']
          description: Average of (time entering COMPLETED − time entering
            STARTED) over steps that completed within the window. Null when
            no step completed.
        completedCount:
          type: integer
          description: Steps that reached COMPLETED within the window.
