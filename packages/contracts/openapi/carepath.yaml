openapi: 3.1.0
info:
  title: CarePath API
  version: 0.1.0
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      responses:
        '200':
          description: Healthy
  /api/v1/visits/{visitId}:
    get:
      parameters:
        - in: path
          name: visitId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Normalized visit view
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Visit not found
        '502':
          description: Upstream HIS error
  /api/v1/visits/{visitId}/next:
    get:
      parameters:
        - in: path
          name: visitId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Next actionable step
  /api/v1/navigation/route:
    get:
      parameters:
        - in: query
          name: from
          required: true
          schema: { type: string }
        - in: query
          name: to
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Navigation route
