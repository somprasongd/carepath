openapi: 3.1.0
info:
  title: CarePath API
  version: 0.23.0
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      responses:
        '200':
          description: Healthy
  /api/v1/auth/session:
    post:
      description: >
        Exchanges a patient credential for an opaque CarePath session token:
        a LINE ID token (source "line"), a demo identity (source "demo", only
        when the server has ALLOW_DEMO_AUTH enabled), or a slip-held
        visit-link token (source "visit-token", only when the visit-link env
        is configured) — the QR-only front door for hospitals without a LINE
        OA, which also claims the visit it addresses and returns its id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSessionResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid identity token, or demo auth disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Visit-token unknown, rotated, cancelled, or past grace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      description: Resolves the Authorization Bearer session token to the identity behind it.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current session identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        '401':
          description: Session not found or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/login:
    post:
      description: >
        Staff/admin login (ADR-0010, FR-18). Verifies a username against an
        argon2id password hash and returns a short-lived JWT access token
        plus a rotating opaque refresh token. Patients never use this
        endpoint — they authenticate through POST /api/v1/auth/session with a
        LINE identity. An unknown username, a wrong password and a
        deactivated account are deliberately indistinguishable: all three
        return the same 401 body, and the server spends the same time on all
        three.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/refresh:
    post:
      description: >
        Exchanges a refresh token for a new access + refresh pair (ADR-0010
        §4). Refresh tokens are single-use — this call spends the presented
        one. Presenting an already-spent token is treated as a leak: every
        refresh token belonging to that user is revoked and the call returns
        401, forcing a real login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: A new token pair; the presented refresh token is now spent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unknown, expired, revoked, or already-spent refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/logout:
    post:
      description: >
        Revokes the presented refresh token. Idempotent — an unknown,
        expired or already-revoked token also returns 204, so a client can
        always clear its own state. The access token is stateless and stays
        valid until it expires (at most ACCESS_TOKEN_TTL, default 15
        minutes).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '204':
          description: Logged out
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/me:
    get:
      description: >
        The staff/admin identity and role codes behind the presented access
        token (ADR-0010). The web console calls it on boot to restore a
        session from a stored refresh token.
      security:
        - staffAuth: []
      responses:
        '200':
          description: The authenticated staff identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffIdentity'
        '401':
          description: Missing, malformed, or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/his/visits/{visitId}/patient-link:
    post:
      description: >
        Mint the visit's patient link (#136, ADR-0014) — the credential the
        printed navigation slip carries. Returns the visit's URL with a
        high-entropy token in the fragment (`#vt=…`): redeeming it at POST
        /api/v1/journeys/claim records the #96 claim for the patient's
        session. Repeat calls return the same URL, so re-printing a slip
        never invalidates the one already in a patient's hand; rotate=true
        discards the current token (lost slip, suspected leak) and the
        previous link stops redeeming. The link's lifetime follows the
        visit: ACTIVE is live, COMPLETED lives out
        VISIT_LINK_COMPLETED_GRACE (default 30m) from the projection's
        completed_at, CANCELLED dies at once. Service-to-service: the
        system's only inbound HIS→CarePath call, authenticated by the
        deployment's HIS API key. Registered only when both HIS_API_KEY and
        VISIT_LINK_SECRET are set (fail closed). format=qr answers the same
        URL as a PNG QR ready for the slip.
      security:
        - hisApiKey: []
      parameters:
        - in: path
          name: visitId
          required: true
          schema: { type: string }
          description: Visit id (VN)
        - in: query
          name: format
          schema: { type: string, enum: [url, qr], default: url }
          description: url answers the link as JSON; qr answers it as a
            PNG QR code of the same URL.
        - in: query
          name: rotate
          schema: { type: boolean, default: false }
          description: Discard the current token and mint a new one.
      responses:
        '200':
          description: The visit's link (format=url as JSON, format=qr as
            image/png)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitLink'
            image/png:
              schema: { type: string, format: binary }
        '400':
          description: Unknown format value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid HIS API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Visit not projected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/journeys/claim:
    post:
      description: >
        Redeem a slip-held visit link token (#136, ADR-0014) for the visit
        it addresses and record the #96 claim — the identity behind the
        patient session becomes the visit's owner, exactly as typing a VN
        used to do on demo deployments. The token rides the request body,
        never a URL. Unknown, rotated, cancelled, past-grace, and
        secret-rotated tokens all answer the same 404 the journey read
        gives — indistinguishable by design.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemVisitLinkRequest'
      responses:
        '200':
          description: Claim recorded; the visit the token addressed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedeemVisitLinkResponse'
        '400':
          description: Missing request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, malformed, or invalid patient session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Visit unknown or link not redeemable —
            indistinguishable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/journeys/{visitId}:
    get:
      description: >
        The patient journey: the CarePath-owned plan derived from HIS facts
        (ADR-0009) — CarePath, not the HIS, decides which steps exist and
        their order. Steps are exposed by `sequence` (display order; not a
        stable identity — replanning may renumber) and `stepKey` (the stable
        identity to address a step by). Patient surface (#96): the patient
        session's identity must have claimed this visit (POST
        /api/v1/journeys/{visitId}/claim — naming the VN is the claim
        credential). A visit that is unknown, unprojected, or claimed by
        another identity all answer the same 404.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: visitId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The projected journey
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Journey'
        '401':
          description: Missing, malformed, or invalid patient session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Visit unknown, not projected, or not claimed by this
            session — indistinguishable by design
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/journeys/{visitId}/claim:
    post:
      description: >
        Mint visit ownership for this session's identity (#96): records that
        the identity behind the patient session may read this visit. Naming
        the VN is the credential, matching the patient front door. Idempotent
        — re-claiming a visit this identity already owns succeeds. This is
        the only way read access to a journey is granted. Demo deployments
        only (ALLOW_DEMO_AUTH): production mints ownership through the
        slip-held link token instead (POST /api/v1/journeys/claim, #136) —
        this route is not registered when the demo bypass is off.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: visitId
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Claim recorded (or already owned by this identity)
        '401':
          description: Missing, malformed, or invalid patient session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Visit unknown or not projected — the same 404 the
            journey read gives
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/journeys/{visitId}/queue:
    get:
      description: >
        The patient queue picture (FR-17, #101): for every currently
        actionable (READY) step bound to a service point, how many people
        are waiting ahead of this patient there right now, and that point's
        average experienced wait so far today (latest READY to latest STARTED
        per step, the same pairing the analytics overview uses, resolved in
        the database's timezone). Averages over zero samples are null, not 0
        — "no data yet" and "zero minutes" are different facts, and clients
        must not render a guess. estimatedWaitMinutes is the naive product
        waitingAhead times avgWaitMinutes, null whenever the average is
        null. Patient surface (#96): the session's identity must have
        claimed this visit; an unclaimed or unknown visit answers the same
        404 as the journey read. A visit with nothing actionable answers an
        empty steps list, not an error.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: visitId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The queue picture for the visit's actionable steps
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JourneyQueue'
        '401':
          description: Missing, malformed, or invalid patient session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Visit unknown, not projected, or not claimed by this
            session — indistinguishable by design
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/journeys/{visitId}/steps/{stepKey}/transition:
    post:
      description: >
        Staff command: transition one step's status (ADR-0009 — CarePath owns
        step status; this no longer forwards to the HIS). Used by the
        service-point console to mark a step arrived/in-progress/completed
        (FR-15) or cancelled. Returns the refreshed journey with the plan
        recomputed against the new fact — completing a diagnostic step, for
        instance, may not yet make its follow-up clinic step actionable if the
        order hasn't resulted (ADR-0009 §5). commandId is an optional
        caller-assigned idempotency key (a fresh UUID is generated when
        absent); source names the acting surface for the audit trail, while
        the authenticated user behind the token is recorded as the actor
        (ADR-0010 §11, NFR-09).
      security:
        - staffAuth: []
      parameters:
        - in: path
          name: visitId
          required: true
          schema: { type: string }
        - in: path
          name: stepKey
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionRequest'
      responses:
        '200':
          description: The refreshed journey after applying the command
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Journey'
        '400':
          description: Invalid body or unknown target status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, malformed, or expired staff access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Authenticated, but the user's roles do not allow this action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Visit or step not found, or journey not projected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Illegal transition (e.g. from a terminal status, or the step is not yet READY)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/journeys/{visitId}/clinics/{clinicCode}/close-round:
    post:
      description: >
        Staff override (ADR-0009 §4): the clinic confirms this round of
        seeing the patient is finished, even though the HIS has not (yet, or
        ever) reported `encounter.completed`. Equivalent in effect to that
        fact arriving — any not-yet-started "return to this clinic" step the
        planner inferred is dropped. Use when a doctor orders a test for a
        future visit rather than this one, or when the connected HIS cannot
        emit `encounter.completed` at all.
      security:
        - staffAuth: []
      parameters:
        - in: path
          name: visitId
          required: true
          schema: { type: string }
        - in: path
          name: clinicCode
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The refreshed journey after closing the round
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Journey'
        '401':
          description: Missing, malformed, or expired staff access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Authenticated, but the user's roles do not allow this action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Visit not found, journey not projected, or the visit has no open round at this clinic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/journeys/{visitId}/share:
    post:
      description: >
        Patient command (ADR-0011): mint a time-limited tracking link for
        this visit to hand to a relative. Requires a patient session
        (bearerAuth). The response carries the raw token exactly once —
        the server stores only its sha256, so it cannot be re-read. At
        most 5 active links per visit; creating beyond that fails with
        409 (revoke first). TTL defaults to 4h (SHARE_LINK_TTL).
        Since #96 the session's identity must have claimed the visit —
        sharing someone else's visit answers the journey read's 404.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: visitId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The minted link — token is shown this one time only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareLinkResponse'
        '401':
          description: Missing, malformed, or invalid patient session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Visit unknown, not projected, or not claimed by this
            session — indistinguishable by design
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Too many active share links for this visit (max 5)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      description: >
        Patient command (ADR-0011): revoke every active share link for
        this visit. Idempotent — revoking with nothing active is still
        204. Requires a patient session (bearerAuth) whose identity has
        claimed the visit (#96).
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: visitId
          required: true
          schema: { type: string }
      responses:
        '204':
          description: All active links revoked (or none existed)
        '401':
          description: Missing, malformed, or invalid patient session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/shared/journey:
    get:
      description: >
        The relative-facing answer (ADR-0011): what the shared holder may
        learn, and nothing more — the current (or next) step as a Thai
        title, a coarse status, and the service point's display name and
        floor. Unknown, expired, and revoked tokens are one and the same
        401: the surface must not confirm which links ever existed. This
        is the only surface shareAuth is valid on.
      security:
        - shareAuth: []
      responses:
        '200':
          description: The redacted shared journey
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedJourney'
        '401':
          description: Unknown, expired, or revoked share token (indistinguishable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/journeys/{visitId}/notifications:
    get:
      description: >
        The visit's queue-proximity notification preference (FR-21, #104).
        No stored preference means enabled — notifications are on unless
        the patient turned them off. Patient surface (#96) — the session's
        identity must have claimed the visit.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: visitId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The visit's notification preference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitNotificationPref'
        '401':
          description: Missing, malformed, or invalid patient session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown visit, or not claimed by this session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      description: >
        Set the visit's queue-proximity notification preference (FR-21,
        #104). Takes effect on the next background sweep. The notification
        itself is one message per step when the visit's queue position
        approaches — never more, and it carries no clinical data. Patient
        surface (#96) — the session's identity must have claimed the visit.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: visitId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VisitNotificationPrefUpdate' }
      responses:
        '200':
          description: The stored preference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitNotificationPref'
        '400':
          description: Invalid body (enabled must be a boolean)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, malformed, or invalid patient session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown visit, or not claimed by this session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/journeys/{visitId}/location:
    get:
      description: The visit's current location — the latest recorded
        location observation (QR scan today; Zigbee or manual later). This
        is the canonical start point for routing. Patient surface (#96) —
        the session's identity must have claimed the visit.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: visitId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Current location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationObservation'
        '401':
          description: Missing, malformed, or invalid patient session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No location recorded yet, or the visit is unknown /
            not claimed by this session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      description: Report a scanned location fix for the visit and record it
        as the current location. The raw payload is the scanned string — a
        CarePath location QR carries a place reference only, never patient
        data; the server resolves it to a canonical navigation node via the
        source's provider (ADR-0004). Patient surface (#96) — the session's
        identity must have claimed the visit.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: visitId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationReportRequest'
      responses:
        '200':
          description: The recorded observation, now the current location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationObservation'
        '400':
          description: Invalid body, unknown source, or a fix that does not
            resolve to a known location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, malformed, or invalid patient session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Visit unknown, not projected, or not claimed by this
            session — indistinguishable by design
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/demo/zigbee/location:
    post:
      description: >
        Demo-only Zigbee simulator (#33): reports a zone-level fix for the
        visit through the canonical ZIGBEE location provider (ADR-0004).
        The zone resolves to its representative navigation node, which
        becomes the routing start point like any other location. Stands in
        for the external positioning service of docs/integration/
        location-zigbee.md during demos; a real Zigbee integration will be
        a separate adapter consuming positioning pushes, not this endpoint.
        Staff-surface: requires a STAFF or ADMIN access token — the
        simulator moves the visit's routing origin, so it is a staff tool
        like the rest of the demo controls.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZigbeeSimulatorRequest'
      responses:
        '200':
          description: The recorded observation, now the current location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationObservation'
        '400':
          description: Invalid body, or a floor/zone that does not resolve
            to a known location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid staff access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Authenticated, but not STAFF or ADMIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/service-points:
    get:
      description: >
        Active service points with their resolved place and floor (#24): the
        service → destination mapping patients navigate by and staff see in
        the console. Read-only — mapping changes go through seed migrations
        for the MVP (FR-11).
      responses:
        '200':
          description: All active service points, ordered by code
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ServicePoint' }
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/service-points/{code}:
    get:
      description: >
        One active service point by its binding code — a clinic code
        (`CLINIC:MED`), an order type (`ORDERTYPE:LAB`), or a fixed code
        (`REGISTRATION`, `CASHIER`, `PHARMACY`) — with the resolved place and
        floor (#24, extended by ADR-0009 for the new step vocabulary).
      parameters:
        - in: path
          name: code
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The service point
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePoint'
        '404':
          description: No active service point for this code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/staff/visits:
    get:
      description: >
        Staff visit monitor (#37): the projected journey of every visit
        CarePath knows, freshest sync first — the same per-visit shape as the
        single-journey read. Reads the CarePath projection only; a visit
        opened in the HIS but not yet ingested is absent until its first fact
        lands. Mounted under /api/v1/staff so the NFR-08 auth guard covers the
        whole group with one middleware (ADR-0010 §7).
      security:
        - staffAuth: []
      responses:
        '200':
          description: All projected journeys, newest sync first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Journey'
        '401':
          description: Missing, malformed, or expired staff access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Authenticated, but the user's roles do not allow this action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/staff/my/service-points:
    get:
      description: >
        The signed-in staff member's workstation picker feed (FR-15, #102):
        the active service points they are assigned to in
        carepath.user_service_point, code-ordered. Admins bypass assignment
        and see the full active list — the picker is also the admin's way to
        watch any station. Unassigned points are simply absent for staff;
        assignment, not existence, decides visibility.
      security:
        - staffAuth: []
      responses:
        '200':
          description: The caller's assigned service points (all of them for admins)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServicePoint'
        '401':
          description: Missing, malformed, or expired staff access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/staff/queue/{servicePointId}:
    get:
      description: >
        One station's live queue (FR-15, #102): the visits currently being
        served at the point (STARTED steps, latest call first) and those
        waiting (READY steps, earliest arrival first — arrival is the latest
        READY event on the step's timeline). Entries carry patient-level
        detail (name, reference) because this is the staff surface calling
        patients in; the analytics module never sees them (NFR-03).
        sequence/totalSteps say where the step sits in its visit's plan, for
        "step X of Y" labels. Assignment decides who may ask: a staff member
        assigned to the point (carepath.user_service_point) or any admin;
        anyone else gets 403 — identical for a point that does not exist, so
        the answer leaks no existence. Calling the next patient is not a new
        mechanism: it is the existing staff transition endpoint moving the
        head of the waiting list to STARTED.
      security:
        - staffAuth: []
      parameters:
        - in: path
          name: servicePointId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The station's queue as of now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationQueue'
        '401':
          description: Missing, malformed, or expired staff access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Authenticated, but not assigned to this service point
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/staff/planning-rules:
    get:
      description: >
        FR-13/US-16 (#100): the journey-planning rules the planner actually
        runs on — the phase ladder (ADR-0009 §3), the order-type to step-kind
        mapping, and worked examples computed by calling the real planner over
        canonical scenarios. Everything is derived from planner.go itself, so
        editing the planner changes this response and the staff screen can
        never drift from the rules in force. Read-only: the rules are code,
        not editable data (ADR-0009 — a CRUD template editor would walk the
        model back to what was retired). Codes only (ADR-0012); all display
        text lives in the client.
      security:
        - staffAuth: []
      responses:
        '200':
          description: The planning rules in force
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanningRules'
        '401':
          description: Missing, malformed, or expired staff access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Authenticated, but the user's roles do not allow this action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/analytics/overview:
    get:
      description: >
        Executive insights dashboard (#86, epic #83): operational metrics
        aggregated from the append-only step timeline
        (carepath.journey_step_status_event, #85) — never patient-level data
        (NFR-03). window=today means midnight-to-now in the configured
        analytics timezone (Asia/Bangkok by default), not the server's UTC
        clock. Executives get EXECUTIVE logins that reach this surface and
        nothing else (ADR-0010).
      security:
        - staffAuth: []
      parameters:
        - in: query
          name: window
          description: Aggregation window. Only "today" exists in the MVP;
            anything else is a 400.
          schema: { type: string, default: today, example: today }
      responses:
        '200':
          description: Aggregated overview for the requested window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsOverview'
        '400':
          description: Unsupported window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, malformed, or expired staff access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Authenticated, but the user's roles do not allow this action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/navigation/route:
    get:
      description: >
        Shortest walkable route for the SVG overlay (#29). `from` is the
        current location's navigation node id — the nodeId of a location
        observation (e.g. I-1301/node-reception). The destination is
        exactly one of `to` — a service point's code (same key as
        /api/v1/service-points/{code}) — or `toPlace`, a place id resolved
        to its entry node the same way (#109: how an amenity from
        /api/v1/navigation/amenities is routed; amenity places have no
        service point code).
      parameters:
        - in: query
          name: from
          required: true
          description: Globally unique navigation node id ("<floorId>/<localId>").
          schema: { type: string }
        - in: query
          name: to
          required: false
          description: Destination service point code, e.g. PHARMACY —
            exactly one of `to` or `toPlace` must be present.
          schema: { type: string }
        - in: query
          name: toPlace
          required: false
          description: Destination place id, e.g. RESTROOM-01 — exactly
            one of `to` or `toPlace` must be present (#109).
          schema: { type: string }
        - in: query
          name: accessibleOnly
          required: false
          description: >
            Skip edges not marked accessible (the stairs transitions) so
            wheelchair routes detour via the elevator instead (FR-20/US-09).
            Absent or false routes over the full graph.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Ordered route — nodes[0] is the origin, the last node the destination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NavigationRoute'
        '400':
          description: Missing from, missing or duplicated destination (to/toPlace), or accessibleOnly is not a boolean
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown node or service point, destination without a mapped place, or no walkable path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/navigation/amenities:
    get:
      description: >
        Nearby amenities while the patient waits (#109 / FR-26): every
        amenity-typed place (restrooms, waiting areas, food stalls — the
        Place.type values hospitalmap counts as amenities) ranked by
        walking distance from one origin, nearest first. The origin is the
        same `from` the route endpoint takes — the current location's node
        id. Distances are authored SVG units, the unit
        NavigationRoute.totalDistance sums. Unreachable amenities are
        absent; none at all is an empty list, never an error.
      parameters:
        - in: query
          name: from
          required: true
          description: Globally unique navigation node id ("<floorId>/<localId>").
          schema: { type: string }
        - in: query
          name: limit
          required: false
          description: Maximum amenities to return.
          schema: { type: integer, minimum: 1, maximum: 50, default: 12 }
        - in: query
          name: accessibleOnly
          required: false
          description: >
            Rank by accessible routes only (stairs skipped) so a wheelchair
            user's nearest amenity is one they can actually walk to (FR-20).
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Amenities ranked nearest-first; empty when none is reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmenitySearch'
        '400':
          description: Missing from, limit out of range, or accessibleOnly is not a boolean
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown origin node
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/places:
    get:
      description: >
        Every place in the hospital map with its floor resolved (#105) —
        the destinations a service point can be mapped to. A place its
        floor's plan has not drawn yet is still listed: selectable, just
        not routable.
      responses:
        '200':
          description: Every place, ordered by place id
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Place'
  /api/v1/admin/floors/{floorId}/plan:
    post:
      description: >
        Replace a floor's plan (FR-11 / ADR-0015). ADMIN only — this
        changes what every patient in the building sees.

        Send the SVG as the raw request body. It is parsed, held to a
        closed allowlist and re-serialized before storage: a rejection
        means the file has to change, because nothing is silently
        stripped. The `viewBox` must match the floor's established
        coordinate space — every place and navigation node is positioned
        in it.

        A place or navigation node the plan does not draw comes back as a
        warning rather than a rejection; the app already shows such a
        place as not routable yet.

        Plans are append-only, so this adds a row and moves the floor's
        pointer. The plan id is derived from the content, so re-uploading
        an unchanged file is idempotent.
      security:
        - staffAuth: []
      parameters:
        - in: path
          name: floorId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          image/svg+xml:
            schema: { type: string }
      responses:
        '201':
          description: Stored and made active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredFloorPlan'
        '400':
          description: >
            The plan broke a rule — a disallowed element or attribute, an
            external reference, a mismatched viewBox, a missing or wrong
            data-floor group, no route layer, or a size limit. The message
            names which.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, malformed, or expired staff access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Authenticated, but not an ADMIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown floor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/floors/{floorId}/plans:
    get:
      description: >
        Every plan stored for this floor, newest first, with the warnings
        each was accepted with. Plans are never deleted, so this is both
        the history and the list a rollback picks from.
      security:
        - staffAuth: []
      parameters:
        - in: path
          name: floorId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The floor's plans, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StoredFloorPlan'
        '401':
          description: Missing, malformed, or expired staff access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Authenticated, but not an ADMIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown floor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/floors/{floorId}/plans/{planId}/activate:
    post:
      description: >
        Make a stored plan the floor's active one — the rollback. Plans are
        append-only, so returning to an earlier drawing moves the floor's
        pointer rather than restoring anything, and the plan being moved
        away from stays available to move back to.
      security:
        - staffAuth: []
      parameters:
        - in: path
          name: floorId
          required: true
          schema: { type: string }
        - in: path
          name: planId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The now-active plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredFloorPlan'
        '401':
          description: Missing, malformed, or expired staff access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Authenticated, but not an ADMIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such plan on that floor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/floors/{floorId}/plans/{planId}/raw:
    get:
      description: >
        The plan as it was uploaded, before normalization, so an admin can
        get back the file they sent. This is never what a patient is served
        — that is always the normalized artifact. It is the one copy in the
        system that has not been through the allowlist, so it is returned
        as a download (`application/octet-stream`, `no-store`) rather than
        as something a browser should render.
      security:
        - staffAuth: []
      parameters:
        - in: path
          name: floorId
          required: true
          schema: { type: string }
        - in: path
          name: planId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The uploaded file
          content:
            application/octet-stream:
              schema: { type: string }
        '401':
          description: Missing, malformed, or expired staff access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Authenticated, but not an ADMIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such plan on that floor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/floors/{floorId}/health:
    get:
      description: >
        Re-checks the floor's active plan against the map model as it
        stands right now (ADR-0015). Unlike the `warnings` on a plan
        returned from `/plans`, which are a snapshot frozen at upload time,
        this recomputes them — so a place or navigation node added or
        removed since the plan was uploaded shows up here even though the
        plan itself has not changed. Empty when the floor has no active
        plan yet.
      security:
        - staffAuth: []
      parameters:
        - in: path
          name: floorId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The active plan's current warnings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FloorPlanWarning'
        '401':
          description: Missing, malformed, or expired staff access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Authenticated, but not an ADMIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown floor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/navigation/nodes:
    get:
      description: >
        The navigation graph's nodes (#105 / ADR-0015). Ids are globally
        unique as `<floorId>/<localId>` because the authored ids are
        floor-local — `node-lift` exists on both floors.

        The web app used to read this from a build-time copy of
        packages/floorplans/graphs. It no longer can: the QR stickers staff
        print for lifts, stairs and entrances are derived from this list, so
        a stale copy would send patients to nodes that no longer exist.
      responses:
        '200':
          description: Every node of the graph, across floors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NavNode'
  /api/v1/navigation/edges:
    get:
      description: >
        The navigation graph's directed, costed edges (#105 / ADR-0015). A
        two-way connection is two rows (A→B and B→A) and a cross-floor
        transition is an edge whose endpoints sit on different floors, so
        this is the whole walkable graph rather than a per-floor slice.
        `distance` is authored schematic SVG units, not metres.
      responses:
        '200':
          description: Every edge of the graph
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NavEdge'
  /api/v1/floors:
    get:
      description: >
        Every floor in display order with the URL of its current plan
        (#105 / ADR-0015). This is the pointer document: it is small, it
        changes whenever a plan is replaced, and so it revalidates, while
        the `planUrl` it hands back names its own digest and is immutable.
        Fetch a plan through the `planUrl` given here rather than
        assembling that URL — the digest is not a client-side concern.

        Before ADR-0015 this list was hardcoded in the web app beside its
        bundled plan assets; plans are now uploaded, so the floor list has
        to be served too.
      responses:
        '200':
          description: Floors in vertical display order
          headers:
            Cache-Control:
              description: Always `no-cache` — the plan pointer must be revalidated.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FloorPlanRef'
  /api/v1/floors/{floorId}/plan/{asset}:
    get:
      description: >
        The normalized floor-plan SVG, addressed by its own sha256
        (#105 / ADR-0015). A different drawing is a different digest and
        therefore a different URL, so this response never changes and is
        cached for a year without revalidation.

        The body is server-generated: an uploaded plan is parsed, held to a
        closed allowlist and re-serialized before it is ever stored, so what
        is served here is never the bytes an uploader supplied.
      parameters:
        - in: path
          name: floorId
          required: true
          description: Floor id, e.g. I-1301.
          schema: { type: string }
        - in: path
          name: asset
          required: true
          description: >
            The plan's sha256 with an `.svg` suffix, exactly as the floors
            listing spells it. The floor is part of the key, so one floor's
            URL cannot reach another floor's drawing.
          schema: { type: string }
      responses:
        '200':
          description: The floor plan
          headers:
            Cache-Control:
              description: '`public, max-age=31536000, immutable`'
              schema: { type: string }
            Content-Security-Policy:
              description: >
                `default-src 'none'; style-src 'unsafe-inline'` — this URL is
                directly navigable, and a directly-navigated SVG would
                otherwise run in the API's own origin.
              schema: { type: string }
            X-Content-Type-Options:
              description: '`nosniff`'
              schema: { type: string }
          content:
            image/svg+xml:
              schema: { type: string }
        '404':
          description: No plan with that digest on that floor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        A patient session token from POST /api/v1/auth/session — opaque,
        server-side, issued against a LINE identity.
    staffAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        A staff/admin JWT access token from POST /api/v1/auth/login or
        /api/v1/auth/refresh (ADR-0010). Distinct from bearerAuth: different
        subject, different store, different lifetime.
    shareAuth:
      type: http
      scheme: bearer
      description: >
        A visit share token from POST /api/v1/journeys/{visitId}/share
        (ADR-0011) — a third credential kind: visit-scoped, read-only,
        time-limited, revocable. Valid only on GET /api/v1/shared/journey;
        every other surface rejects it with 401, and it is never accepted in
        a URL or query string (NFR-08).
    hisApiKey:
      type: apiKey
      in: header
      name: X-HIS-API-Key
      description: >
        The deployment's shared service key authenticating the HIS on
        CarePath's one inbound service-to-service surface: the visit-link
        mint (POST /api/v1/his/visits/{visitId}/patient-link, #136). Unlike
        the three credential kinds above it grants no patient or staff
        identity — it mints a credential, it is not one.
  schemas:
    Error:
      type: object
      description: Error envelope shared by all endpoints. code is the
        machine-readable apperr kind ("invalid", "unauthorized",
        "forbidden", "not_found", "conflict", "upstream", "internal") the
        frontend branches on; error is the human-safe message.
      required: [error, code]
      properties:
        error: { type: string }
        code: { type: string }
    VisitLink:
      type: object
      description: >
        The visit's patient link (#136): the slip-held credential. visitUrl
        carries the token in its fragment (#vt=…), never a query string, so
        it cannot reach an access log. The raw token is never stored
        server-side (sha256 only, ADR-0011 precedent).
      required: [visitId, visitUrl]
      properties:
        visitId: { type: string, example: VISIT-001 }
        visitUrl:
          type: string
          example: https://carepath.example/patient/journey#vt=5Xy_EHiOtUrt9xEv4NqzRQ
    RedeemVisitLinkRequest:
      type: object
      description: The vt token from the slip URL's fragment.
      required: [token]
      properties:
        token: { type: string }
    RedeemVisitLinkResponse:
      type: object
      description: The visit the redeemed token addressed, now claimed by
        this session's identity.
      required: [visitId]
      properties:
        visitId: { type: string, example: VISIT-001 }
    LoginRequest:
      type: object
      description: Staff/admin credentials (ADR-0010). The demo deployment seeds
        admin/demo (ADMIN) and staff/demo (STAFF) — demo credentials only.
      required: [username, password]
      properties:
        username: { type: string, example: staff }
        password: { type: string, format: password, example: demo }
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    AuthTokens:
      type: object
      description: >
        The credential pair issued by login and refresh. accessToken is an
        HS256 JWT carrying sub/username/roles/typ=access; refreshToken is an
        opaque random string the server keeps only as a SHA-256 hash, and is
        spent by the next refresh.
      required: [accessToken, refreshToken, expiresAt, refreshExpiresAt, identity]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresAt:
          type: string
          format: date-time
          description: When accessToken expires (ACCESS_TOKEN_TTL, default 15m).
        refreshExpiresAt:
          type: string
          format: date-time
          description: When refreshToken expires (REFRESH_TOKEN_TTL, default 7d).
        identity: { $ref: '#/components/schemas/StaffIdentity' }
    StaffIdentity:
      type: object
      description: A staff/admin user. Not interchangeable with Identity, which
        describes a patient's external (LINE) identity.
      required: [userId, username, displayName, roles]
      properties:
        userId: { type: string }
        username: { type: string }
        displayName: { type: string }
        roles:
          type: array
          description: Role codes granted to this user (ADR-0010 §5). The console
            derives its landing screen and visible actions from these — a user
            never picks their own role.
          items:
            type: string
            enum: [ADMIN, STAFF]
    NavigationRoute:
      type: object
      description: Ordered shortest path between two nodes (#28). Nodes[0]
        is the origin, the last node the destination, and segments[i] is the
        edge walked from nodes[i] to nodes[i+1]; totalDistance sums the
        segment costs in authored SVG units, not metres.
      required: [nodes, segments, totalDistance]
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/NavNode'
        segments:
          type: array
          items:
            $ref: '#/components/schemas/NavEdge'
        totalDistance: { type: number }
    AmenitySearch:
      type: object
      description: >
        The answer of GET /api/v1/navigation/amenities (#109) — amenity
        places ranked by walking distance from `from`, nearest first.
        Client display policy (which kinds to surface, the
        wait-long-enough gate) is the client's, per ADR-0012.
      required: [from, amenities]
      properties:
        from: { type: string }
        amenities:
          type: array
          items:
            $ref: '#/components/schemas/AmenityNearby'
    AmenityNearby:
      type: object
      description: >
        One ranked amenity: the place in the same shape /api/v1/places
        serves (floor included, so floor labels need no second request)
        and its walking distance in authored SVG units — the unit
        NavigationRoute.totalDistance sums.
      required: [place, distance]
      properties:
        place:
          $ref: '#/components/schemas/Place'
        distance: { type: number }
    NavNode:
      type: object
      description: One walkable point of the hospital. x/y are floor-local
        SVG units, so the overlay groups consecutive nodes by floorId and
        draws a polyline per floor.
      required: [id, floorId, x, y, nodeType]
      properties:
        id: { type: string }
        floorId: { type: string }
        x: { type: number }
        y: { type: number }
        nodeType:
          type: string
          description: What kind of walkable point this is.
          enum: [ENTRANCE, PLACE_ENTRY, CORRIDOR, ELEVATOR, STAIRS]
        zone: { type: string }
    NavEdge:
      type: object
      description: One directed walk between neighbouring nodes; edgeType
        carries the turn-by-turn cue (corridor vs elevator vs stairs).
        Two-way walks are two segments.
      required: [id, fromNodeId, toNodeId, edgeType, distance, accessible]
      properties:
        id: { type: string }
        fromNodeId: { type: string }
        toNodeId: { type: string }
        edgeType:
          type: string
          enum: [CORRIDOR, ELEVATOR, STAIRS]
        distance: { type: number }
        accessible: { type: boolean }
    ServicePoint:
      type: object
      description: Links a service code to a physical Place in the hospital map.
        Place is the resolved destination (place + floor); null when the place
        is not in the map yet — the same explicit unmapped state as a null
        servicePoint on a journey step (#24).
      required: [id, code, name, placeId]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        placeId: { type: string }
        place:
          allOf:
            - $ref: '#/components/schemas/Place'
          nullable: true
    Place:
      type: object
      description: A physical place on a floor plan, keyed by the stable SVG
        place id that also keys the navigation graphs in packages/floorplans.
        x/y are floor-local SVG units of the place's entry node; entryNodeId
        references that node in the navigation graph (#26) as a
        floor-prefixed global id, e.g. I-1301/node-reception.
      required: [id, floorId, name, type, floor]
      properties:
        id: { type: string }
        floorId: { type: string }
        name: { type: string }
        type:
          type: string
          description: Place category from the hospital map.
          enum: [ROOM, COUNTER, WAITING_AREA, RESTROOM, ELEVATOR, STAIRWAY, RAMP, ENTRANCE, AMENITY, FOOD_STALL]
        x: { type: number }
        y: { type: number }
        entryNodeId: { type: string }
        floor: { $ref: '#/components/schemas/Floor' }
    Floor:
      type: object
      description: One floor of a building, identified by the floor-plan id
        (e.g. I-1301).
      required: [id, buildingId, code, name, levelOrder]
      properties:
        id: { type: string }
        buildingId: { type: string }
        code: { type: string }
        name: { type: string }
        levelOrder: { type: integer }
        viewBox:
          type: string
          description: >
            The floor's coordinate space, e.g. "0 0 1600 900" — the space
            every Place x/y and every navigation node coordinate is
            expressed in. Set by the floor's first plan and unchanged by
            later ones (ADR-0015). Absent on a floor with no plan yet.
    FloorPlanWarning:
      type: object
      description: >
        Something the plan and the map model disagree about that does not
        make the plan unusable (ADR-0015). Stable codes, no display text —
        the client owns the words (ADR-0012).
      required: [code, ref]
      properties:
        code:
          type: string
          description: >
            `PLACE_MISSING` — the model has this place on this floor but
            the plan does not draw it. `PLACE_UNKNOWN` — the plan draws a
            place the model does not have. `NODE_MISSING` — the graph has
            this node but the plan does not draw it.
          enum: [PLACE_MISSING, PLACE_UNKNOWN, NODE_MISSING]
        ref:
          type: string
          description: The place id or floor-local navigation node id concerned.
    StoredFloorPlan:
      type: object
      description: >
        A plan as stored (ADR-0015). Rows are append-only, so this is never
        edited — a new upload is a new row and the floor's pointer moves.
        The SVG itself is not in this shape; fetch it through the floors
        listing's planUrl.
      required: [planId, floorId, sha256, viewBox, warnings, createdAt]
      properties:
        planId: { type: string }
        floorId: { type: string }
        sha256:
          type: string
          description: Digest of the normalized plan; also its cache key in the serving URL.
        viewBox:
          type: string
          description: The coordinate space, always equal to the floor's.
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/FloorPlanWarning'
        createdAt: { type: string, format: date-time }
        createdBy:
          type: string
          description: >
            The admin who uploaded it. Absent on the plans seeded from
            packages/floorplans, which no admin uploaded.
    FloorPlanRef:
      type: object
      description: >
        A floor and where to fetch its drawing (#105 / ADR-0015). Note that
        `floorId` is what `Floor.id` calls `id`: this shape is the plan
        pointer document, not a Floor.
      required: [floorId, buildingId, code, name, levelOrder]
      properties:
        floorId: { type: string }
        buildingId: { type: string }
        code: { type: string }
        name: { type: string }
        levelOrder: { type: integer }
        viewBox:
          type: string
          description: The floor's coordinate space, as on Floor.
        planUrl:
          type: string
          description: >
            Immutable URL of the floor's current plan, digest included.
            Absent on a floor with no plan yet — the same explicit
            "not available" state the rest of the map model uses, rather
            than a URL that would 404.
        activePlanId:
          type: string
          description: >
            The plan id planUrl was built from — present exactly when
            planUrl is. Lets a caller who already holds a plan id (e.g.
            from GET .../admin/floors/{floorId}/plans) tell it is the
            active one directly, rather than checking whether its digest
            appears inside planUrl.
    StepKind:
      type: string
      description: >
        What kind of step this is, for display and for resolving its service
        point binding (ADR-0009). `CLINIC` steps carry `clinicCode`; `LAB`,
        `XRAY`, `EKG`, `ULTRASOUND` steps carry `orderRefs`; `REGISTRATION`,
        `CASHIER`, `PHARMACY` are fixed, unique-per-visit steps.
      enum: [REGISTRATION, CLINIC, LAB, XRAY, EKG, ULTRASOUND, CASHIER, PHARMACY]
    JourneyStep:
      type: object
      description: One step of the journey plan CarePath derived from HIS facts (ADR-0009).
      required: [stepKey, sequence, kind, status, servicePointId]
      properties:
        stepKey:
          type: string
          description: >
            Stable identity for this step across replans (e.g. "CLINIC:MED:2",
            "LAB:ORD-118", "CASHIER"). Use this, not `sequence`, to address a
            step (transitions, tracking which step a screen is showing).
        sequence:
          type: integer
          description: Display order as of the current plan. Not stable across
            a replan — a step's sequence can change when facts change; its
            stepKey never does.
        kind: { $ref: '#/components/schemas/StepKind' }
        clinicCode:
          type: [string, "null"]
          description: Set when kind is CLINIC.
        round:
          type: [integer, "null"]
          description: 1-based visit count to this clinic within the visit; set when kind is CLINIC. A value above 1 means the patient is returning to a doctor they already saw this visit.
        orderRefs:
          type: array
          description: HIS order ids this step represents. Orders of the same
            type placed in the same round collapse into one step.
          items: { type: string }
        status:
          type: string
          description: >
            Canonical step status. WAITING means every action the patient can
            take is done (e.g. blood drawn) but the step is not yet actionable
            for what comes after it — waiting on `order.resulted` (ADR-0009 §5).
          enum: [PENDING, WAITING, READY, STARTED, COMPLETED, CANCELLED]
        servicePointId:
          type: [string, "null"]
          description: Bound service point id; null when no service point is configured for this step's binding key (explicit unmapped state).
        servicePoint:
          allOf:
            - $ref: '#/components/schemas/ServicePoint'
          nullable: true
          description: The bound service point, when configured and still active.
    Journey:
      type: object
      description: >
        The journey plan CarePath derived from one HIS visit's facts
        (ADR-0009). Steps in the same phase are not ordered against each
        other — a patient with both a lab and an X-ray before their clinic may
        do either first — so more than one step can be `actionable` at once.
      required: [visitId, patientRef, status, completed, steps, actionable, syncedAt]
      properties:
        visitId: { type: string }
        patientRef: { type: string }
        patientName:
          type: string
          description: Patient display name for staff screens (ADR-0009 §8); absent on patient-facing reads.
        status:
          type: string
          description: Canonical visit status.
          enum: [ACTIVE, COMPLETED, CANCELLED]
        completed:
          type: boolean
          description: True iff the visit status is COMPLETED — the unambiguous
            finished signal; actionable is empty and recommended is null in
            that case.
        steps:
          type: array
          description: All steps of the plan ordered by sequence.
          items: { $ref: '#/components/schemas/JourneyStep' }
        actionable:
          type: array
          description: Every step currently READY — what the patient could do
            right now, in any order.
          items: { $ref: '#/components/schemas/JourneyStep' }
        recommended:
          allOf:
            - $ref: '#/components/schemas/JourneyStep'
          nullable: true
          description: >
            CarePath's pick among `actionable` for the patient-facing single
            primary action; null when actionable is empty. Ranked by shortest
            walking distance from the visit's last known location when one
            exists (recommendationReason NEAREST), otherwise by plan sequence
            (recommendationReason PLAN_ORDER). Queue length deliberately does
            not rank it (#103) — a recommendation must stay put while the
            patient walks, and queue ticks would flip it; the queue picture
            rides /api/v1/journeys/{visitId}/queue (FR-17) beside the pick
            instead.
        recommendationReason:
          type: string
          nullable: true
          enum: [NEAREST, PLAN_ORDER]
          description: >
            Which criterion produced `recommended`, so the pick is
            explainable rather than a black box (ADR-0012 — a stable code;
            the patient-facing text lives in the web catalogs). NEAREST is
            the shortest walking distance on the navigation graph from the
            visit's last recorded location observation (default
            accessibility). PLAN_ORDER means no usable location, so the
            plan's own sequence decides; actionable steps that cannot be
            routed rank after every routed one, ties by sequence. Null
            exactly when `recommended` is null.
        syncedAt: { type: string, format: date-time }
    JourneyQueue:
      type: object
      description: >
        The patient queue picture for one visit's actionable steps (FR-17,
        #101). Computed by the journey module from its own projection and
        timeline — analytics-style aggregates without the analytics module,
        which stays executive-only and patient-free. Empty steps is a valid
        answer: nothing actionable, or nothing bound to a service point.
      required: [visitId, asOf, steps]
      properties:
        visitId: { type: string }
        asOf:
          type: string
          format: date-time
          description: When the counts were taken.
        steps:
          type: array
          description: One entry per READY step bound to a service point.
          items: { $ref: '#/components/schemas/JourneyQueueStep' }
    JourneyQueueStep:
      type: object
      description: One actionable step's queue numbers.
      required: [stepKey, servicePointId, waitingAhead, avgWaitMinutes, estimatedWaitMinutes]
      properties:
        stepKey: { type: string }
        servicePointId: { type: string }
        waitingAhead:
          type: integer
          description: Other visits' READY steps at this service point right
            now — the patient's own step is excluded, so 0 means "you are
            next".
        avgWaitMinutes:
          type: number
          nullable: true
          description: Average experienced wait at this point so far today;
            null when there are no samples — never 0, which would claim a
            measured zero-minute wait.
        estimatedWaitMinutes:
          type: number
          nullable: true
          description: The naive product waitingAhead times
            avgWaitMinutes — a rank-order estimate, not a promise; null
            whenever avgWaitMinutes is null.
    StationQueue:
      type: object
      description: >
        One service point's live queue (FR-15, #102): who is being served
        right now and who is waiting, in call order. serving and waiting are
        always arrays (possibly empty) so clients can render an honest
        "nobody waiting" instead of guessing at null.
      required: [servicePointId, asOf, serving, waiting]
      properties:
        servicePointId: { type: string }
        asOf:
          type: string
          format: date-time
          description: When the picture was taken.
        serving:
          type: array
          description: STARTED steps at this point, latest call first.
          items: { $ref: '#/components/schemas/StationQueueEntry' }
        waiting:
          type: array
          description: READY steps at this point, earliest arrival first.
          items: { $ref: '#/components/schemas/StationQueueEntry' }
    StationQueueEntry:
      type: object
      description: One visit at a station — the staff-facing unit that calls
        a patient by name. Patient detail appears here and only here among
        queue surfaces; analytics stays aggregate-only (NFR-03).
      required: [visitId, stepKey, kind, sequence, totalSteps, status, patientRef, patientName]
      properties:
        visitId: { type: string }
        stepKey: { type: string }
        kind: { type: string }
        clinicCode:
          type: string
          nullable: true
        round:
          type: integer
          nullable: true
        sequence:
          type: integer
          description: The step's 1-based position in its visit's plan.
        totalSteps:
          type: integer
          description: Steps in the visit's plan — the Y in "step X of Y".
        status: { type: string, enum: [READY, STARTED] }
        patientRef: { type: string }
        patientName: { type: string }
        readyAt:
          type: string
          format: date-time
          nullable: true
          description: Latest READY event for the step — the arrival that
            sets the waiting order; null when the timeline has none.
        startedAt:
          type: string
          format: date-time
          nullable: true
          description: Latest STARTED event for the step — when the station
            called this patient in; null while still waiting.
    PlanningRules:
      type: object
      description: >
        The journey-planning rules in force, derived from the planner itself
        (#100): the phase ladder, the order-type mapping, and worked examples
        computed by the real planner. Editing the planner code changes this
        response — that is the point.
      required: [phases, orderTypes, examples]
      properties:
        phases:
          type: array
          description: The phase ladder in ascending order (ADR-0009 §3). A
            step becomes actionable only once every strictly-lower phase is
            COMPLETED or CANCELLED; steps sharing a phase carry no order
            between them (§6).
          items: { $ref: '#/components/schemas/PlanningPhase' }
        orderTypes:
          type: array
          description: Every canonical HIS order type and the step kind the
            planner derives from it, in the his package's canonical order.
          items: { $ref: '#/components/schemas/PlanningOrderType' }
        examples:
          type: array
          description: >
            Worked scenarios — HIS facts fed to the real Plan function and the
            steps it returned, statuses included. Not illustrative strings:
            the same inputs produce the same steps a patient would see.
          items: { $ref: '#/components/schemas/PlanningExample' }
    PlanningPhase:
      type: object
      required: [number, key]
      properties:
        number:
          type: integer
          description: Phase number; strictly lower means strictly earlier.
        key:
          type: string
          description: Stable phase code (ADR-0012 — the client owns display
            text).
          enum: [REGISTRATION, PRE_VISIT, CLINIC, MID_VISIT, RETURN_CLINIC, CASHIER, PHARMACY]
    PlanningOrderType:
      type: object
      required: [orderType, stepKind]
      properties:
        orderType: { type: string }
        stepKind:
          type: string
          description: >
            The step kind an order of this type becomes, or empty when the
            order type deliberately produces no walked step: DRUG only
            surfaces as the visit-wide PHARMACY step.
    PlanningExample:
      type: object
      required: [id, scenario, steps]
      properties:
        id:
          type: string
          description: Stable scenario code the client keys its display text on.
        scenario:
          $ref: '#/components/schemas/PlanningExampleScenario'
        steps:
          type: array
          items: { $ref: '#/components/schemas/PlanningExampleStep' }
    PlanningExampleScenario:
      type: object
      description: The HIS facts a worked scenario feeds the planner.
      required: [visitType, clinics, orders]
      properties:
        visitType: { type: string }
        clinics:
          type: array
          description: Clinic codes the visit belongs to.
          items: { type: string }
        orders:
          type: array
          items: { $ref: '#/components/schemas/PlanningExampleOrder' }
    PlanningExampleOrder:
      type: object
      description: One order of a worked scenario. An order placed at or
        before the visit opened (empty orderedByClinic in the canonical
        scenarios) is pre-visit; one placed later belongs to the named clinic
        (mid-visit).
      required: [orderRef, orderType, orderedByClinic]
      properties:
        orderRef: { type: string }
        orderType: { type: string }
        orderedByClinic: { type: string }
    PlanningExampleStep:
      type: object
      description: One step of a worked example — the plan Step shape minus
        projection concerns (no service-point binding behind a synthetic
        scenario).
      required: [stepKey, sequence, kind, status]
      properties:
        stepKey: { type: string }
        sequence: { type: integer }
        kind: { $ref: '#/components/schemas/StepKind' }
        clinicCode:
          type: [string, "null"]
        round:
          type: [integer, "null"]
        orderRefs:
          type: array
          items: { type: string }
        status:
          type: string
          enum: [PENDING, WAITING, READY, STARTED, COMPLETED, CANCELLED]
    ShareLinkResponse:
      type: object
      description: >
        The one-time mint of a visit share link (ADR-0011). The token is
        the bearer credential the relative's device presents to
        GET /api/v1/shared/journey; the server keeps only its sha256, so
        this response is the last time anyone can read it.
      required: [token, expiresAt]
      properties:
        token:
          type: string
          description: 64-char hex share token — send as Authorization Bearer, never in a URL.
        expiresAt: { type: string, format: date-time }
    SharedJourney:
      type: object
      description: >
        The relative-facing read (ADR-0011 §3) — a deliberate disclosure
        list, not a redacted Journey: current step title, coarse status,
        where, and when. No patient name, no ids, no codes, no step list.
      required: [status, updatedAt, expiresAt]
      properties:
        status:
          type: string
          description: Coarse progress — the only status vocabulary on this surface.
          enum: [WAITING, IN_SERVICE, DONE]
        currentStep:
          allOf:
            - $ref: '#/components/schemas/SharedStep'
          nullable: true
          description: The step happening now, else the next one; null once the visit is DONE.
        updatedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    SharedStep:
      type: object
      description: One step as a relative may see it — display strings only.
      required: [title, status]
      properties:
        title:
          type: string
          description: Thai display title of the step kind (e.g. พบแพทย์, เจาะเลือด / ส่งตรวจแล็บ).
        status:
          type: string
          enum: [WAITING, IN_SERVICE, DONE]
        servicePointName:
          type: string
          description: Display name of the step's service point, code suffix stripped; absent when unmapped.
        floorName:
          type: string
          description: Floor display name (e.g. ชั้น 1); absent when unmapped.
    TransitionRequest:
      type: object
      description: The client-facing transition command (#19, amended by ADR-0009 — no longer forwarded to the HIS).
      required: [to]
      properties:
        to:
          type: string
          description: Target step status.
          enum: [STARTED, COMPLETED, CANCELLED]
        commandId:
          type: string
          format: uuid
          description: Optional caller-assigned idempotency key; generated when absent.
        source:
          type: string
          description: Acting surface for the audit trail, e.g. staff-web or patient-web. Defaults to unknown.
    Identity:
      type: object
      description: A verified external identity behind a CarePath session.
      required: [source, externalId]
      properties:
        source:
          type: string
          enum: [line, demo, visit]
        externalId: { type: string }
        displayName: { type: string }
    CreateSessionRequest:
      type: object
      required: [source, idToken]
      properties:
        source:
          type: string
          enum: [line, demo, visit-token]
        idToken:
          type: string
          description: The LINE ID token (source "line") or the visit-link token (source "visit-token"). Ignored (may be empty) for source "demo".
    CreateSessionResponse:
      type: object
      required: [sessionToken, identity, expiresAt]
      properties:
        sessionToken: { type: string }
        visitId:
          type: string
          description: Set only by source "visit-token" — the visit the slip token addressed, already claimed for this session.
        identity: { $ref: '#/components/schemas/Identity' }
        expiresAt: { type: string, format: date-time }
    VisitNotificationPref:
      type: object
      description: >
        The visit's queue-proximity notification preference (FR-21, #104,
        ADR-0013). Per visit, patient-owned, default enabled.
      required: [visitId, enabled]
      properties:
        visitId: { type: string }
        enabled: { type: boolean }
    VisitNotificationPrefUpdate:
      type: object
      description: The toggle for PUT /api/v1/journeys/{visitId}/notifications.
      required: [enabled]
      properties:
        enabled: { type: boolean }
    LocationObservation:
      type: object
      description: The normalized current-location result every provider
        resolves onto (ADR-0004). nodeId is the canonical navigation node
        ("<floorId>/<localId>"); zone and confidence are optional — exact
        sources such as QR leave them unset.
      required: [visitId, nodeId, floorId, source, observedAt]
      properties:
        visitId: { type: string }
        nodeId: { type: string }
        floorId: { type: string }
        zone:
          type: [string, 'null']
          description: Positioning zone from the navigation graph, e.g. PUBLIC, OPD.
        source:
          type: string
          description: Which provider produced the fix — QR, ZIGBEE, or MANUAL.
        confidence:
          type: [number, 'null']
          description: 0..1 for probabilistic sources (Zigbee); null for exact ones.
        observedAt: { type: string, format: date-time }
    LocationReportRequest:
      type: object
      description: One scanned fix. raw is the payload exactly as scanned —
        opaque to the client; the server's provider resolves it.
      required: [source, raw]
      properties:
        source:
          type: string
          description: Provider source to resolve through, e.g. QR.
        raw: { type: string }
    ZigbeeSimulatorRequest:
      type: object
      description: One simulated Zigbee zone fix for the demo endpoint
        (#33) — where the visit's tag is and how confident the simulated
        positioning is.
      required: [visitId, floorId, zone]
      properties:
        visitId: { type: string }
        floorId: { type: string }
        zone:
          type: string
          description: Positioning zone on that floor, e.g. PUBLIC, WELLNESS.
        confidence:
          type: [number, 'null']
          description: Optional 0..1 confidence of the simulated fix.
    AnalyticsOverview:
      type: object
      description: >
        Executive overview for one window (#86). Every average is null —
        never 0 — when no sample exists for it: "no data yet" and "zero
        minutes" are different facts, and the dashboard renders null as an
        em dash rather than a misleading 0.
      required: [asOf, window, summary, servicePoints]
      properties:
        asOf: { type: string, format: date-time }
        window:
          type: string
          description: The window requested (and validated) — "today".
        summary: { $ref: '#/components/schemas/AnalyticsSummary' }
        servicePoints:
          type: array
          description: One entry per active service point, ordered by code.
          items: { $ref: '#/components/schemas/ServicePointMetrics' }
    AnalyticsSummary:
      type: object
      description: Visit-wide numbers for the window.
      required: [activeVisits, avgWaitMinutes, avgVisitMinutes, bottleneckServicePointId]
      properties:
        activeVisits:
          type: integer
          description: Visits currently ACTIVE (a "now" number, not windowed).
        avgWaitMinutes:
          type: [number, 'null']
          description: Average over steps that started within the window of
            (time entering STARTED − time entering READY the latest time
            before that). Null when no step started in the window.
        avgVisitMinutes:
          type: [number, 'null']
          description: Average of (last timeline event − first timeline
            event) over visits that are COMPLETED and whose last event falls
            within the window. Null when no visit finished.
        bottleneckServicePointId:
          type: [string, 'null']
          description: Service point with the highest avgWaitMinutes; ties
            break by waitingNow. Null when no service point has wait data.
    ServicePointMetrics:
      type: object
      description: Per-service-point operational metrics for the window.
      required: [servicePointId, code, name, waitingNow, inProgressNow, longestWaitingMinutes, avgWaitMinutes, avgServiceMinutes, completedCount]
      properties:
        servicePointId: { type: string }
        code: { type: string }
        name: { type: string }
        waitingNow:
          type: integer
          description: Steps currently READY and bound to this service point
            (a "now" number, from current state, not windowed).
        inProgressNow:
          type: integer
          description: Steps currently STARTED and bound to this service
            point ("now", not windowed).
        longestWaitingMinutes:
          type: [number, 'null']
          description: now − (time the still-READY step entered READY),
            longest among currently waiting steps. Null when nobody is
            waiting.
        avgWaitMinutes:
          type: [number, 'null']
          description: Same definition as AnalyticsSummary.avgWaitMinutes,
            restricted to this service point. Null when no sample.
        avgServiceMinutes:
          type: [number, 'null']
          description: Average of (time entering COMPLETED − time entering
            STARTED) over steps that completed within the window. Null when
            no step completed.
        completedCount:
          type: integer
          description: Steps that reached COMPLETED within the window.
