openapi: 3.1.0
info:
  title: CarePath API
  version: 0.4.2
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      responses:
        '200':
          description: Healthy
  /api/v1/visits/{visitId}:
    get:
      description: >
        Normalized visit view: the HIS visit enriched with the first READY
        step and its configured service point, if any.
      parameters:
        - in: path
          name: visitId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Normalized visit view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitView'
        '404':
          description: Visit not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Upstream HIS error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/visits/{visitId}/next:
    get:
      description: The next actionable (READY) step, resolved to its service point.
      parameters:
        - in: path
          name: visitId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Next actionable step
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NextStep'
        '404':
          description: No next actionable step, or visit not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Upstream HIS error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/session:
    post:
      description: >
        Exchanges a LINE ID token (source "line"), or a demo identity (source
        "demo", only when the server has ALLOW_DEMO_AUTH enabled), for an
        opaque CarePath session token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSessionResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid identity token, or demo auth disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      description: Resolves the Authorization Bearer session token to the identity behind it.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current session identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        '401':
          description: Session not found or expired

  /api/v1/journeys/{visitId}:
    get:
      description: >
        The patient journey: the CarePath-owned projection of the HIS visit
        (ADR-0008), with steps ordered by sequence and the deterministic
        current/next step resolution. A visit not yet projected (ingest lag)
        returns 404.
      parameters:
        - in: path
          name: visitId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The projected journey
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Journey'
        '404':
          description: No journey projected for this visit id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/journeys/{visitId}/steps/{sequence}/transition:
    post:
      description: >
        Command: transition one service step's status. Forwards the command
        to the HIS — the system of record (ADR-0008) — and returns the
        refreshed journey with the recalculated current/next step. Illegal or
        out-of-order transitions are rejected by the HIS. commandId is an
        optional caller-assigned idempotency key (a fresh UUID is generated
        when absent); source names the acting surface for the audit trail.
      parameters:
        - in: path
          name: visitId
          required: true
          schema: { type: string }
        - in: path
          name: sequence
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionRequest'
      responses:
        '200':
          description: The refreshed journey after applying the command
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Journey'
        '400':
          description: Invalid body or unknown target status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Visit or step not found, or journey not projected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Illegal transition (e.g. from a terminal status)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Upstream HIS error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/service-points:
    get:
      description: >
        Active service points with their resolved place and floor (#24): the
        service → destination mapping patients navigate by and staff see in
        the console. Read-only — mapping changes go through seed migrations
        for the MVP (FR-11).
      responses:
        '200':
          description: All active service points, ordered by code
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ServicePoint' }
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/service-points/{code}:
    get:
      description: >
        One active service point by its service code (e.g. LAB), with the
        resolved place and floor — the destination lookup for a care step's
        service code (#24).
      parameters:
        - in: path
          name: code
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The service point
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePoint'
        '404':
          description: No active service point for this code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/staff/visits:
    get:
      description: >
        Staff visit monitor (#37): the projected journey of every visit
        CarePath knows, freshest sync first — the same per-visit shape as the
        single-journey read (ordered steps, resolved service points,
        deterministic current/next). Reads the CarePath projection only; a
        visit opened in the HIS but not yet ingested is absent until its
        first event lands. Mounted under /api/v1/staff so the NFR-08 auth
        guard (#43) can cover the group.
      responses:
        '200':
          description: All projected journeys, newest sync first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Journey'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/navigation/route:
    get:
      description: Not implemented yet — reserved for the navigation module.
      parameters:
        - in: query
          name: from
          required: true
          schema: { type: string }
        - in: query
          name: to
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Navigation route
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A CarePath session token from POST /api/v1/auth/session.
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    VisitStep:
      type: object
      description: A care step as reported by the HIS.
      required: [sequence, serviceCode, status]
      properties:
        sequence: { type: integer }
        serviceCode: { type: string }
        status:
          type: string
          description: HIS step status, e.g. COMPLETED, READY, PENDING.
    Visit:
      type: object
      description: A visit as reported by the HIS.
      required: [visitId, patientRef, status, steps]
      properties:
        visitId: { type: string }
        patientRef: { type: string }
        status:
          type: string
          description: HIS visit status, e.g. ACTIVE.
        steps:
          type: array
          items: { $ref: '#/components/schemas/VisitStep' }
    ServicePoint:
      type: object
      description: Links a service code to a physical Place in the hospital map.
        Place is the resolved destination (place + floor); null when the place
        is not in the map yet — the same explicit unmapped state as a null
        servicePoint on a journey step (#24).
      required: [id, code, name, placeId]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        placeId: { type: string }
        place:
          allOf:
            - $ref: '#/components/schemas/Place'
          nullable: true
    Place:
      type: object
      description: A physical place on a floor plan, keyed by the stable SVG
        place id that also keys the navigation graphs in packages/floorplans.
        x/y are floor-local SVG units of the place's entry node; entryNodeId
        references that node in the floor graph (a plain string until the
        graph model lands in #26).
      required: [id, floorId, name, type, floor]
      properties:
        id: { type: string }
        floorId: { type: string }
        name: { type: string }
        type:
          type: string
          description: Place category from the hospital map.
          enum: [ROOM, COUNTER, WAITING_AREA, RESTROOM, ELEVATOR, STAIRWAY, RAMP, ENTRANCE, AMENITY]
        x: { type: number }
        y: { type: number }
        entryNodeId: { type: string }
        floor: { $ref: '#/components/schemas/Floor' }
    Floor:
      type: object
      description: One floor of a building, identified by the floor-plan id
        (e.g. I-1301).
      required: [id, buildingId, code, name, levelOrder]
      properties:
        id: { type: string }
        buildingId: { type: string }
        code: { type: string }
        name: { type: string }
        levelOrder: { type: integer }
    NextStep:
      type: object
      description: The first READY step of a visit, resolved to its service point
        when one is configured for the step's service code.
      required: [sequence, status]
      properties:
        sequence: { type: integer }
        status: { type: string }
        servicePoint: { $ref: '#/components/schemas/ServicePoint' }
    JourneyStep:
      type: object
      description: One care step of the journey projection, resolved to its
        configured service point when one exists.
      required: [sequence, serviceCode, status, servicePointId]
      properties:
        sequence: { type: integer }
        serviceCode:
          type: string
          description: External service code in HIS vocabulary (e.g. LAB).
        status:
          type: string
          description: Canonical step status (PENDING, READY, STARTED, COMPLETED, CANCELLED).
        servicePointId:
          type: [string, "null"]
          description: Bound service point id; null when no service point is configured for the code (explicit unmapped state).
        servicePoint:
          allOf:
            - $ref: '#/components/schemas/ServicePoint'
          nullable: true
          description: The bound service point, when configured and still active.
    Journey:
      type: object
      description: The projected journey of one HIS visit with deterministic
        current/next step resolution.
      required: [visitId, patientRef, status, completed, steps, syncedAt]
      properties:
        visitId: { type: string }
        patientRef: { type: string }
        status:
          type: string
          description: Canonical visit status.
          enum: [ACTIVE, COMPLETED, CANCELLED]
        completed:
          type: boolean
          description: True iff the visit status is COMPLETED — the unambiguous
            finished signal; current and next are null in that case.
        steps:
          type: array
          description: All steps of the visit ordered by sequence.
          items: { $ref: '#/components/schemas/JourneyStep' }
        current:
          allOf:
            - $ref: '#/components/schemas/JourneyStep'
          nullable: true
          description: The first STARTED step by sequence, if any.
        next:
          allOf:
            - $ref: '#/components/schemas/JourneyStep'
          nullable: true
          description: The first READY step by sequence — the next actionable
            step, if any.
        syncedAt: { type: string, format: date-time }
    TransitionRequest:
      type: object
      description: The client-facing transition command (#19). Mirrors the
        canonical TransitionCommand CarePath forwards to the HIS.
      required: [to]
      properties:
        to:
          type: string
          description: Target step status.
          enum: [STARTED, COMPLETED, CANCELLED]
        commandId:
          type: string
          format: uuid
          description: Optional caller-assigned idempotency key; generated when absent.
        source:
          type: string
          description: Acting surface for the audit trail, e.g. staff-web or patient-web. Defaults to unknown.
    VisitView:
      type: object
      description: The Visit fields plus the resolved next step.
      required: [visitId, patientRef, status, steps]
      properties:
        visitId: { type: string }
        patientRef: { type: string }
        status: { type: string }
        steps:
          type: array
          items: { $ref: '#/components/schemas/VisitStep' }
        next: { $ref: '#/components/schemas/NextStep' }
    Identity:
      type: object
      description: A verified external identity behind a CarePath session.
      required: [source, externalId]
      properties:
        source:
          type: string
          enum: [line, demo]
        externalId: { type: string }
        displayName: { type: string }
    CreateSessionRequest:
      type: object
      required: [source, idToken]
      properties:
        source:
          type: string
          enum: [line, demo]
        idToken:
          type: string
          description: The LINE ID token. Ignored (may be empty) for source "demo".
    CreateSessionResponse:
      type: object
      required: [sessionToken, identity, expiresAt]
      properties:
        sessionToken: { type: string }
        identity: { $ref: '#/components/schemas/Identity' }
        expiresAt: { type: string, format: date-time }
